                </svg>
            </div>

            <!-- Title & Close -->
            <div class="flex-1">
                <h2 id="modalTitle" class="text-lg font-semibold text-gray-900">Access Required</h2>
            </div>
            
            <button 
                id="closeModal" 
                class="absolute right-6 top-6 text-2xl text-gray-400 hover:text-gray-900"

            </button>
        </div>

        <!-- Body -->

            </p>
        </div>

    function displayOrdersByProduct(orders) {
        const ordersContainer = document.getElementById('ordersContainer');
        ordersContainer.innerHTML = '';
        
        // Aggregate product data across all orders
        const productsMap = orders.reduce((acc, order) => {
            order.items.forEach(item => {
                const key = item.productId || item.productName;
                if (!acc[key]) {
                    acc[key] = {
                        productId: item.productId,
                        name: item.productName,
                        price: item.price,
                        totalQuantity: 0,
                        totalRevenue: 0,
                        orders: [],
                        customers: new Set(),
                        firstOrderDate: order.orderDate,
                        lastOrderDate: order.orderDate
                    };
                }
                
                acc[key].totalQuantity += item.quantity;
                acc[key].totalRevenue += item.quantity * item.price;
                acc[key].orders.push(order.id);
                acc[key].customers.add(order.customer.userPhone || order.customer.phone);
                
                // Update date range
                if (new Date(order.orderDate) < new Date(acc[key].firstOrderDate)) {
                    acc[key].firstOrderDate = order.orderDate;
                }
                if (new Date(order.orderDate) > new Date(acc[key].lastOrderDate)) {
                    acc[key].lastOrderDate = order.orderDate;
                }
            });
            return acc;
        }, {});

        // Convert to array and sort by total quantity
        const productGroups = Object.values(productsMap).sort((a, b) => b.totalQuantity - a.totalQuantity);

        productGroups.forEach(product => {
            const productCard = document.createElement('div');
            productCard.className = 'bg-white rounded-lg shadow-md p-6';
            productCard.innerHTML = `
                <div class="border-b pb-3 mb-6">
                    <div class="flex justify-between items-start">
                        <div>
                            <h3 class="text-primary text-xl font-bold">${product.name}</h3>
                            <p class="text-gray-700 text-base font-semibold py-2">$${product.price.toFixed(2)} per unit</p>
                        </div>
                    </div>
                </div>
                <div class="product-orders">
                    <div class="flex justify-between items-center">
                        <h4 class="list-title hidden text-gray-900 text-base font-semibold">Recently Ordered </h4>
                        <button class="toggle-orders ml-auto hover:text-secondary bg-[#f1f0fb] text-blue-600 text-base font-semibold px-4 py-2 rounded">
                            Show Orders
                        </button>
                    </div>
                    <div class="orders-list hidden space-y-2 mt-6 mb-2">
                        ${product.orders.slice(0, 5).map(orderId => {
                            const order = orders.find(o => o.id === orderId);
                            return `
                                <div class="flex justify-between items-center text-sm p-2 bg-gray-50 rounded">
                                    <div>
                                        <span class="font-medium">Order #${orderId.toUpperCase()}</span>
                                        <span class="text-gray-600 ml-2">
                                            ${new Date(order.orderDate).toLocaleDateString()}
                                        </span>
                                    </div>
                                    <button data-order-id="${orderId}" 
                                        class="view-details-btn text-primary hover:text-secondary font-medium">
                                        View
                                    </button>
                                </div>
                            `;
                        }).join('')}
                        ${product.orders.length > 5 ? 
                            `<div class="text-center text-sm text-gray-600 mt-2">
                                + ${product.orders.length - 5} more orders
                            </div>` : ''}
                    </div>
                </div>
            `;

            ordersContainer.appendChild(productCard);

            // Add toggle functionality
            const toggleBtn = productCard.querySelector('.toggle-orders');
            const ordersList = productCard.querySelector('.orders-list');
            const listTitle = productCard.querySelector('.list-title');
            toggleBtn.addEventListener('click', () => {
                ordersList.classList.toggle('hidden');
                listTitle.classList.toggle('hidden');
                toggleBtn.textContent = ordersList.classList.contains('hidden') 
                    ? 'Show Orders' 
                    : 'Hide Orders';
            });
        });

        // Add event listeners to view buttons
        document.querySelectorAll('.view-details-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                const orderId = e.target.getAttribute('data-order-id');
                const order = orders.find(o => o.id === orderId);
                showOrderDetails(order);
            });
        });
    }

        });
    }

        // For dateString in format "4/21/2025, 12:49:56 AM"
        function extractMonthDay(dateString) {
            const datePart = dateString.split(",")[0];
            const [month, day] = datePart.split("/");
            const monthNames = [
                "January", "February", "March", "April", "May", "June",
                "July", "August", "September", "October", "November", "December"
            ];
            return `${monthNames[parseInt(month) - 1]} ${parseInt(day)}`;
        }

        // Convert +1########## into (###) ###-####
        function formatPhoneNumber(phoneNumber) {
            // Remove the leading '+' and country code
            const cleaned = phoneNumber.replace(/^\+1/, ''); // Assuming the country code is always +1
            // Extract area code and the rest of the number
            const areaCode = cleaned.slice(0, 3);
            const firstPart = cleaned.slice(3, 6);
            const secondPart = cleaned.slice(6, 10);
            
            // Format the phone number
            return `(${areaCode}) ${firstPart}-${secondPart}`;
        }


    </script>
