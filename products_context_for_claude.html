    <style>
        .order-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }
        .tab-active {
            border-bottom: 3px solid #5D5CDE;
            font-weight: 600;
        }
        /* Add toast styles here */
        .toast {
            transition: all 0.3s ease;
            opacity: 0;
            transform: translateY(20px);
        }
        .toast.show {
            opacity: 1;
            transform: translateY(0);
        }
        
 
        /* VERSION 2.0 -- Perfect VERTICAL and SWIPER alignment BUT Centered Between Slides*/
        /* Image carousel container styles */
        .product-carousel {
            width: 100%;
            /* height: calc(100vh/3); */
            /* height: 250px; */
            overflow: hidden;
            position: relative;
            background-color: #f0f0f0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .product-carousel .swiper,
        .product-carousel .swiper-wrapper,
        .product-carousel .swiper-slide {
            width: 100%;
            height: 100%;
            /* display: flex;
            align-items: center;
            justify-content: center; */
        }

        .product-carousel img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
        }

        /* Gallery modal */
        .gallery-modal {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(0, 0, 0, 0.9);
            z-index: 50;
            display: none;
            justify-content: center;
            align-items: center;
            transition: opacity 0.3s ease;
        }

        .gallery-modal.active {
            display: flex;
        }

        /* Swiper customization */
        .swiper-pagination-bullet {
            background: #5D5CDE;
            opacity: 0.7;
        }

        .swiper-pagination-bullet-active {
            background: #A5A4FF;
            opacity: 1;
        }

        /* Product card swipers */
        .product-carousel .swiper-button-next,
        .product-carousel .swiper-button-prev {
            color: white;
            background: rgba(0, 0, 0, 0.3);
            width: 30px;
            height: 30px;
            border-radius: 50%;
            --swiper-navigation-size: 18px;
        }

        .product-carousel .swiper-button-next:hover,
        .product-carousel .swiper-button-prev:hover {
            background: rgba(0, 0, 0, 0.5);
        }

        /* Make sure pagination is visible on product cards */
        .product-carousel .swiper-pagination {
            bottom: 5px;
        }

        /* Image count badge */
        .image-count {
            z-index: 10;
        }

        /* Zoom effect for modal */
        .modal-img-container {
            max-width: 90vw;
            max-height: 90vh;
        }

        .modal-img-container img {
            max-width: 100%;
            max-height: 90vh;
            object-fit: contain;
        }
    </style>

</head>

    <!-- @@@ MAIN BODY SECTION -->

    <script>
        // Firebase Configuration
        const firebaseConfig = {
          apiKey: "AIzaSyCTUZbw1qSdFEBG2SGo7smQgqXEKZZWCaw",
          authDomain: "mei-wen-ti.firebaseapp.com",
          projectId: "mei-wen-ti",
          storageBucket: "mei-wen-ti.firebasestorage.app",
          messagingSenderId: "103509830524",
          appId: "1:103509830524:web:5ddef022db357ce99152f9",
        };
        
        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore(); // Add Firestore reference
        const auth = firebase.auth();
        
        // Initialize cart
        let cart = [];
        
        // Initialize cart-related DOM elements
        const cartItems = document.getElementById('cartItems');
        const cartTotal = document.getElementById('cartTotal');
        const clearCartBtn = document.getElementById('clearCartBtn');
        const closeModalBtn = document.getElementById('closeModalBtn');
        const confirmationMessage = document.getElementById('confirmationMessage');
        const confirmationModal = document.getElementById('confirmationModal');
        const emptyCartImage = document.getElementById('emptyCartImage');
        const emptyCartMessage = document.getElementById('emptyCartMessage');
        const loadingOverlay = document.getElementById('loadingOverlay');
        const orderForm = document.getElementById('orderForm');
        const orderReference = document.getElementById('orderReference');
        const productList = document.getElementById('productList');
        const searchInput = document.getElementById('searchInput');
        const submitOrderBtn = document.getElementById('submitOrderBtn');
        const galleryModal = document.getElementById('galleryModal');
        const modalSwiperWrapper = document.getElementById('modalSwiperWrapper');

        // Global variables for swipers
        let productSwipers = {};
        let modalSwiper;
        
        // Initialize modal swiper
        function initModalSwiper() {
            modalSwiper = new Swiper('.modalSwiper', {
                slidesPerView: 1,
                spaceBetween: 30,
                loop: true,
                pagination: {
                    el: '.swiper-pagination',
                    clickable: true,
                },
                navigation: {
                    nextEl: '.swiper-button-next',
                    prevEl: '.swiper-button-prev',
                },

        }
        
        // Initialize after DOM is loaded
        document.addEventListener('DOMContentLoaded', function() {
            initModalSwiper();
            
            // Close modal when clicking close button
            document.getElementById('closeModal').addEventListener('click', function() {
                galleryModal.classList.remove('active');
            });
            
            // Close modal when clicking outside the image
            galleryModal.addEventListener('click', function(e) {
                if (e.target === galleryModal) {
                    galleryModal.classList.remove('active');
                }
            });
        });

        // Initialize delivery type DOM elements
        const deliveryTypeSelect = document.getElementById('deliveryType');
        const addressContainer = document.getElementById('addressContainer');
        const addressInput = document.getElementById('address');

        // Add event listener for delivery type change
        deliveryTypeSelect.addEventListener('change', handleDeliveryTypeChange);
        
        // Trigger change event on page load
        handleDefaultDeliveryType();
        handleDeliveryTypeChange();
        

        
        // Authentication State
        let isLoggedIn = false;
        let currentUser = null;
        let verificationId = null;
        
        // Authentication Elements
        const loginBtn = document.getElementById('loginBtn');
        const loginBtnMobile = document.getElementById('loginBtnMobile');
        const authModal = document.getElementById('authModal');
        const phoneInputContainer = document.getElementById('phoneInputContainer');
        const codeInputContainer = document.getElementById('codeInputContainer');
        const authSuccessContainer = document.getElementById('authSuccessContainer');
        const phoneNumberInput = document.getElementById('phoneNumber');
        const sendCodeBtn = document.getElementById('sendCodeBtn');
        const verifyCodeBtn = document.getElementById('verifyCodeBtn');
        const closeAuthModalBtn = document.getElementById('closeAuthModalBtn');
        const verificationInputs = document.querySelectorAll('.verification-code-input');
        const phoneError = document.getElementById('phoneError');
        const codeError = document.getElementById('codeError');
        const userPhoneDisplay = document.getElementById('userPhoneDisplay');
        
        // Open auth modal when login button is clicked
        loginBtn.addEventListener('click', () => {
            if (isLoggedIn) {
                // Show logout confirmation or account management options
                if (confirm('Do you want to log out?')) {
                    logoutUser();
                }
            } else {
                showAuthModal();
            }
        });

        loginBtnMobile.addEventListener('click', () => {
            if (isLoggedIn) {
                // Show logout confirmation or account management options
                if (confirm('Do you want to log out?')) {
                    logoutUser();
                }
            } else {
                showAuthModal();
            }
        });
        
        // Close auth modal
        closeAuthModalBtn.addEventListener('click', () => {
            authModal.classList.add('hidden');
            resetAuthModal();
        });
        
        // Initialize reCAPTCHA
        function initRecaptcha() {
            // Reset the container first
            document.getElementById('recaptcha-container').innerHTML = '';
            
            // Create a new reCAPTCHA widget
            window.recaptchaVerifier = new firebase.auth.RecaptchaVerifier('recaptcha-container', {
                'size': 'normal',
                'callback': (response) => {
                    // reCAPTCHA solved, enable the button
                    sendCodeBtn.disabled = false;
                },
                'expired-callback': () => {
                    // Response expired. Ask user to solve reCAPTCHA again.
                    sendCodeBtn.disabled = true;
                }
            });
            
            window.recaptchaVerifier.render().then((widgetId) => {
                window.recaptchaWidgetId = widgetId;
            });
        }
        
        // Show auth modal
        function showAuthModal() {
            authModal.classList.remove('hidden');
            resetAuthModal();
            initRecaptcha();
        }
        
        // Reset auth modal
        function resetAuthModal() {
            phoneInputContainer.classList.remove('hidden');
            codeInputContainer.classList.add('hidden');
            authSuccessContainer.classList.add('hidden');
            phoneNumberInput.value = '';
            phoneError.classList.add('hidden');
            codeError.classList.add('hidden');
            
            // Reset verification code inputs
            verificationInputs.forEach(input => {
                input.value = '';
                input.classList.remove('border-red-500');
            });
        }
        
        // Send verification code
        sendCodeBtn.addEventListener('click', async () => {
            const phoneNumber = phoneNumberInput.value.trim();
            
            if (!phoneNumber) {
                phoneError.textContent = 'Please enter a valid phone number';
                phoneError.classList.remove('hidden');
                return;
            }
            
            try {
                sendCodeBtn.disabled = true;
                sendCodeBtn.textContent = 'Sending...';
                
                // Send verification code
                const appVerifier = window.recaptchaVerifier;
                const confirmationResult = await firebase.auth().signInWithPhoneNumber(phoneNumber, appVerifier);
                verificationId = confirmationResult.verificationId;
                
                // Show verification code input
                phoneInputContainer.classList.add('hidden');
                codeInputContainer.classList.remove('hidden');
                
                // Focus on the first verification code input
                verificationInputs[0].focus();
                
                // Handle verification code inputs
                setupVerificationInputs();
            } catch (error) {
                console.error('Error sending verification code:', error);
                phoneError.textContent = error.message || 'Error sending verification code. Please try again.';
                phoneError.classList.remove('hidden');
                sendCodeBtn.disabled = false;
                sendCodeBtn.textContent = 'Send Verification Code';
                
                // Reset reCAPTCHA
                window.recaptchaVerifier.reset(window.recaptchaWidgetId);
                initRecaptcha();
            }
        });
        


        // Product cache
        let productCache = new Map();

        // Open gallery modal with selected image
        function openGalleryModal(productId, initialSlide = 0) {
            const product = productCache.get(productId);
            if (!product || !product.images || product.images.length === 0) return;
            
            // Clear previous slides
            modalSwiperWrapper.innerHTML = '';
            
            // Create slide for each image
            product.images.forEach(image => {
                const slide = document.createElement('div');
                slide.className = 'swiper-slide flex items-center justify-center';
                slide.innerHTML = `
                    <div class="modal-img-container">
                        <img src="${image.url}" alt="${product.name}" class="w-full">
                    </div>
                `;
                modalSwiperWrapper.appendChild(slide);
            });
            
            // Update and show modal swiper
            galleryModal.classList.add('active');
            modalSwiper.update();
            modalSwiper.slideTo(initialSlide, 0);
        }
        
        // Initialize product carousel
        function initProductCarousel(productId) {
            productSwipers[productId] = new Swiper(`.swiper-${productId}`, {
                slidesPerView: 1,
                spaceBetween: 0,
                loop: true,
                pagination: {
                    el: `.swiper-pagination-${productId}`,
                    clickable: true,
                },
                navigation: {
                    nextEl: `.swiper-button-next-${productId}`,
                    prevEl: `.swiper-button-prev-${productId}`,
                },
                on: {
                    click: function(swiper, event) {
                        // Only open gallery if not clicking on navigation
                        if (!event.target.classList.contains('swiper-button-next') && 
                            !event.target.classList.contains('swiper-button-prev')) {
                            openGalleryModal(productId, swiper.realIndex);
                        }
                    }
                }
            });
        }


        // Display products
        async function displayProducts() {
            productList.innerHTML = '<div class="flex flex-col h-full bg-white dark:bg-gray-800 rounded-lg shadow-md overflow-hidden">Loading...</div>';
            
            try {
                const snapshot = await db.collection('products').orderBy('name').get();
                
                if (snapshot.empty) {
                    productList.innerHTML = '<div class="col-span-full text-center py-8">No products available</div>';
                    return;
                }
                
                // Clear existing cache
                productCache.clear();
                productSwipers = {};
                
                productList.innerHTML = '';
                snapshot.forEach((doc) => {
                    const product = {
                        id: doc.id,
                        ...doc.data()
                    };
                    
                    // Cache the product
                    productCache.set(doc.id, product);
                    
                    const productCard = document.createElement('div');
                    productCard.className = 'w-full h-full border border-gray-200 dark:border-gray-700 rounded-lg overflow-hidden transition-all hover:shadow-md';
                    
                    // Determine what images to display
                    let carouselHTML = '';
                    
                    if (product.images && product.images.length > 0) {
                        // Create swiper carousel with images
                        carouselHTML = `
                            <div class="product-carousel h-[calc(100vh/3)] sm:h-[calc(100vh/5)] bg-gray-100 dark:bg-gray-700 p-1.5 pb-0 overflow-hidden">
                                <div class="swiper swiper-${doc.id}">
                                    <div class="swiper-wrapper">
                                        ${product.images.map(image => `
                                            <div class="swiper-slide">
                                                <img src="${image.url}" alt="${product.name}" class="w-full h-full rounded-t-lg">
                                            </div>
                                        `).join('')}
                                    </div>
                                    <div class="swiper-pagination swiper-pagination-${doc.id}"></div>
                                    <div class="swiper-button-prev swiper-button-prev-${doc.id}"></div>
                                    <div class="swiper-button-next swiper-button-next-${doc.id}"></div>
                                    ${product.images.length > 1 ? `<div class="image-count absolute top-1.5 right-2 bg-black bg-opacity-50 text-white text-xs px-2 py-1 rounded-full">${product.images.length} images</div>` : ''}
                                </div>
                            </div>
                        `;
                    } else if (product.imageUrl) {
                        // Fallback to legacy imageUrl
                        carouselHTML = `
                            <div class="product-carousel bg-gray-100 dark:bg-gray-700 h-[calc(100vh/3)] sm:h-[calc(100vh/5)] p-1.5 pb-0 overflow-hidden">
                                <img src="${product.imageUrl}" alt="${product.name}" class="w-full h-full object-cover rounded-t-lg">
                            </div>
                        `;
                    } else {
                        // No image
                        carouselHTML = `
                            <div class="product-carousel bg-gray-100 dark:bg-gray-700 h-[calc(100vh/3)] sm:h-[calc(100vh/5)] p-1.5 pb-0 overflow-hidden flex items-center justify-center">
                                <div class="text-gray-400">No Image</div>
                            </div>
                        `;
                    }

                    productCard.innerHTML = `
                        ${carouselHTML}

                        <div class="p-4 flex flex-col flex-grow justify-between">
                            <h3 class="text-white text-lg font-semibold mr-auto border-b border-[#f13dc3] pr-0.5 pb-1.5">${product.name}</h3>
                            <p class="text-base font-semibold my-2 pt-2 mb-1">$${product.price.toFixed(2)}</p>
                            <p class="text-sm text-gray-600 dark:text-gray-400 mb-3">${product.description}</p>
                            <div class="flex justify-between items-center mt-auto">
                                <!-- Quantity Controls -->
                                <div class="flex items-center">
                                    <button data-product-id="${doc.id}" class="decrease-qty bg-gray-200 dark:bg-gray-700 w-8 h-8 flex items-center justify-center rounded-l-md">-</button>
                                    <input type="number" min="1" value="1" class="qty-input w-12 h-8 text-center border-y border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-800 text-base" data-product-id="${doc.id}">
                                    <button data-product-id="${doc.id}" class="increase-qty bg-gray-200 dark:bg-gray-700 w-8 h-8 flex items-center justify-center rounded-r-md">+</button>
                                </div>
                                <!-- Cart Button -->
                                <button data-product-id="${doc.id}" class="add-to-cart bg-primary hover:bg-secondary text-white py-1 px-3 rounded-md text-sm">
                                    Add to Cart
                                </button>
                            </div>
                        </div>
                    `;
        
                    productList.appendChild(productCard);
                    
                    // Initialize swiper for this product if it has multiple images
                    if (product.images && product.images.length > 0) {
                        setTimeout(() => initProductCarousel(doc.id), 0);
                    }
                });

                // Add event listeners for product cards
                document.querySelectorAll('.add-to-cart').forEach(button => {
                    button.addEventListener('click', addToCart);
                });

                document.querySelectorAll('.increase-qty').forEach(button => {
                    button.addEventListener('click', (e) => {
                        const id = e.target.dataset.productId;
                        const input = document.querySelector(`.qty-input[data-product-id="${id}"]`);
                        input.value = parseInt(input.value) + 1;
                    });
                });

                document.querySelectorAll('.decrease-qty').forEach(button => {
                    button.addEventListener('click', (e) => {
                        const id = e.target.dataset.productId;
                        const input = document.querySelector(`.qty-input[data-product-id="${id}"]`);
                        if (parseInt(input.value) > 1) {
                            input.value = parseInt(input.value) - 1;
                        }
                    });
                });
                
            } catch (error) {
                console.error("Error loading products:", error);
                productList.innerHTML = `<div class="col-span-full text-center py-8 text-red-500">Error loading products: ${error.message}</div>`;
            }
        }

        // Handle image loading errors and fallbacks
        function handleImageError(img, productId) {
            // Set fallback image or default placeholder
            img.src = '/assets/placeholder.jpg';
            img.onerror = null; // Prevent infinite loops if fallback also fails
        }

        // Event listeners
        if (clearCartBtn) clearCartBtn.addEventListener('click', clearCart);
        if (orderForm) orderForm.addEventListener('submit', submitOrder);
        if (closeModalBtn) closeModalBtn.addEventListener('click', () => {
            confirmationModal.classList.add('hidden');
        });
        searchInput.addEventListener('input', searchProducts);

        // Handle browser back button for modal
        window.addEventListener('popstate', function(e) {
            if (galleryModal.classList.contains('active')) {
                galleryModal.classList.remove('active');
            }
        });

        // Allow swiping on touch devices for modal
        document.addEventListener('touchstart', handleTouchStart, false);
        document.addEventListener('touchmove', handleTouchMove, false);

        let xDown = null;
        let yDown = null;

        function handleTouchStart(evt) {
            xDown = evt.touches[0].clientX;
            yDown = evt.touches[0].clientY;
        }

        function handleTouchMove(evt) {
            if (!xDown || !yDown) {
                return;
            }

            const xUp = evt.touches[0].clientX;
            const yUp = evt.touches[0].clientY;
            const xDiff = xDown - xUp;
            const yDiff = yDown - yUp;

            // Detect if it's a swipe on modal
            if (galleryModal.classList.contains('active')) {
                if (Math.abs(xDiff) > Math.abs(yDiff)) {
                    if (xDiff > 0) {
                        // Swipe left - next slide
                        modalSwiper.slideNext();
                    } else {
                        // Swipe right - previous slide
                        modalSwiper.slidePrev();
                    }
                } else {
                    if (yDiff > 50) {
                        // Swipe up - close modal
                        galleryModal.classList.remove('active');
                    }
                }
            }

            xDown = null;
            yDown = null;
        }

        function formatPhoneNumber(phoneNumber) {
            // Remove the leading '+' and country code
            const cleaned = phoneNumber.replace(/^\+1/, ''); // Assuming the country code is always +1
            // Extract area code and the rest of the number
            const areaCode = cleaned.slice(0, 3);
            const firstPart = cleaned.slice(3, 6);
            const secondPart = cleaned.slice(6, 10);
            
            // Format the phone number
            return `(${areaCode}) ${firstPart}-${secondPart}`;
        }
