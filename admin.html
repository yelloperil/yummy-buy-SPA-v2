            ['chronologicalView', 'userView', 'productView'].forEach(id => {
                const btn = document.getElementById(id);
                if (id === activeId) {
                    btn.classList.add('bg-primary', 'text-white');

                } else {
                    btn.classList.remove('bg-primary', 'text-white');

                }
            });
        }

        // Helper for Group by User View component
        function getStatusColor(status) {
            const statusColors = {
                'order placed': 'text-blue-600',
                'order on-hold': 'text-yellow-600',
                'order completed': 'text-green-600',
                'order cancelled': 'text-red-600',
            };
            return statusColors[status] || 'text-gray-600';
        }

        // Helper for Order Details Modal component
        function getStatusBgColor(status) {
            const statusColors = {
                'order placed': 'bg-blue-100 text-blue-800',
                'order on-hold': 'bg-yellow-100 text-yellow-800',
                'order completed': 'bg-green-100 text-green-800',
                'order cancelled': 'bg-gray-100 text-red-800'
            };
            return statusColors[status] || 'bg-gray-100 text-gray-800';
        }

        // [Continued in next message...]

// [Add this code after the existing JavaScript in admin.html]

        // Order Loading Functions
        async function loadOrders(viewType) {
            const ordersContainer = document.getElementById('ordersContainer');
            ordersContainer.innerHTML = '<div class="col-span-full text-center py-8">Loading orders...</div>';
            
            try {
                // Check if we're in offline mode or local testing
                let orders = [];
                
                try {
                    let query = db.collection('orders').orderBy('orderDate', 'desc');
                    const statusFilter = document.getElementById('statusFilter').value;
                    const dateFilter = document.getElementById('dateFilter').value;
                    
                    // Apply filters
                    if (statusFilter !== 'all') {
                        query = query.where('status', '==', statusFilter);
                    }
                    if (dateFilter) {
                        const startDate = new Date(dateFilter);
                        const endDate = new Date(startDate);
                        endDate.setDate(endDate.getDate() + 1);
                        query = query.where('orderDate', '>=', startDate.toISOString())
                                    .where('orderDate', '<', endDate.toISOString());
                    }
                    
                    const snapshot = await query.get();
                    
                    if (snapshot.empty) {
                        ordersContainer.innerHTML = '<div class="col-span-full text-center py-8">No orders found</div>';
                        return;
                    }
                    
                    snapshot.forEach(doc => {
                        orders.push({ id: doc.id, ...doc.data() });
                    });
                } catch (error) {
                    console.warn("Error fetching orders from Firestore, using sample data:", error);
                    
                    // Use sample data for local testing
                    orders = [
                        {
                            id: "sample1",
                            orderDate: new Date().toISOString(),
                            status: "order placed",
                            total: "45.99",
                            customer: {

                                email: "john@example.com",

                                notes: "Please leave at the door"
                            },
                            items: [
                                {
                                    productName: "Fresh Vegetables",
                                    quantity: 2,
                                    price: 12.99,
                                    subtotal: "25.98"
                                },
                                {
                                    productName: "Premium Meat",
                                    quantity: 1,
                                    price: 19.99,
                                    subtotal: "19.99"
                                }
                            ]
                        },
                        {
                            id: "sample2",
                            orderDate: new Date(Date.now() - 86400000).toISOString(), // Yesterday
                            status: "order completed",
                            total: "32.50",
                            customer: {
                                name: "Jane Smith",
                                phone: "555-987-6543",
                                email: "jane@example.com",
                                address: "456 Oak Ave\nOthertown, CA 54321"
                            },
                            items: [
                                {
                                    productName: "Fresh Fruit Basket",
                                    quantity: 1,
                                    price: 32.50,
                                    subtotal: "32.50"
                                }
                            ]
                        }
                    ];
                }
                
                // Group orders based on view type
                switch(viewType) {
                    case 'user':
                        displayOrdersByUser(orders);
                        break;
                    case 'product':
                        displayOrdersByProduct(orders);
                        break;
                    default:
                        displayChronologicalOrders(orders);
                }
                
            } catch (error) {
                console.error("Error loading orders:", error);
                ordersContainer.innerHTML = `<div class="col-span-full text-center py-8 text-red-500">Error loading orders: ${error.message}</div>`;
            }
        }

        function displayChronologicalOrders(orders) {
            const ordersContainer = document.getElementById('ordersContainer');
            ordersContainer.innerHTML = '';
            
            orders.forEach(order => {
                const orderDate = new Date(order.orderDate).toLocaleString();
                const totalItems = order.items.reduce((sum, item) => sum + item.quantity, 0);
                
                const orderCard = document.createElement('div');
                orderCard.className = 'flex flex-col bg-white rounded-lg shadow-md p-6 order-card transition-all';
                orderCard.innerHTML = `
                    <div class="flex justify-between items-start mb-2">
                        <h3 class="text-[#9289fe] text-lg sm:text-xl font-bold">${order.customer.name}</h3>
                        <span class="bg-[#f1f0fb] px-3 py-1 rounded text-sm sm:text-base font-semibold ${getStatusColor(order.status)}">${order.status}</span>
                    </div>
                    <div class="flex justify-between text-sm">
                        <span class="flex gap-2 text-xs sm:text-sm font-medium">#${order.id.toUpperCase()}</span>
                        <span class="flex gap-2 text-xs sm:text-sm font-medium">${orderDate}</span>
                    </div>
                    <div class="my-3 mt-6">
                        <span class="bg-[#fef2f9] text-[#ffa2e0] px-3 py-1 rounded text-sm sm:text-base font-bold">${extractMonthDay(orderDate)}</span>
                    </div>
                    <div class="flex justify-between items-end">
                        <div class="flex items-center">
                            <span class="text-base sm:text-lg text-[#9289fe] font-bold">$${order.total}</span>
                            <span class="text-base font-medium mx-2"> – </span>

        function displayOrdersByProduct(orders) {
            const ordersContainer = document.getElementById('ordersContainer');

            // Aggregate product data across all orders
            const productsMap = orders.reduce((acc, order) => {
                order.items.forEach(item => {
                    const key = item.productId || item.productName;
                    if (!acc[key]) {
                        acc[key] = {
                            productId: item.productId,
                            name: item.productName,
                            price: item.price,
                            totalQuantity: 0,
                            totalRevenue: 0,
                            orders: [],
                            customers: new Set(),
                            firstOrderDate: order.orderDate,
                            lastOrderDate: order.orderDate
                        };
                    }
                    
                    acc[key].totalQuantity += item.quantity;
                    acc[key].totalRevenue += item.quantity * item.price;
                    acc[key].orders.push(order.id);
                    acc[key].customers.add(order.customer.userPhone || order.customer.phone);
                    
                    // Update date range
                    if (new Date(order.orderDate) < new Date(acc[key].firstOrderDate)) {
                        acc[key].firstOrderDate = order.orderDate;
                    }
                    if (new Date(order.orderDate) > new Date(acc[key].lastOrderDate)) {
                        acc[key].lastOrderDate = order.orderDate;

                });

            // Convert to array and sort by total quantity
            const productGroups = Object.values(productsMap).sort((a, b) => b.totalQuantity - a.totalQuantity);

        async function updateOrderStatus(orderId) {
            const newStatus = document.getElementById('orderStatus').value;
            const saveBtn = document.getElementById('saveStatusBtn');
            
            try {
                saveBtn.disabled = true;
                saveBtn.textContent = 'Saving...';
                
                await db.collection('orders').doc(orderId).update({
                    status: newStatus,
                    lastUpdated: firebase.firestore.FieldValue.serverTimestamp()
                });
                
                // Update UI
                document.getElementById('orderStatus').className = `p-1 border rounded ${getStatusBgColor(newStatus)}`;
                saveBtn.textContent = 'Updated!';
                
                // Refresh order list after a delay
                setTimeout(() => {
                    const currentView = document.querySelector('[id$="View"].bg-primary').id;
                    loadOrders(currentView.replace('View', ''));
                    document.getElementById('closeOrderModal').click();
                }, 1000);

                saveBtn.textContent = 'Save';
                
            } catch (error) {
                console.error("Error updating status:", error);
                saveBtn.textContent = 'Error! Try Again';
                saveBtn.disabled = false;
            }
        }

async function loadProducts(filter = 'all') {
    const productsList = document.getElementById('productsList');
    if (!productsList) {
        console.error("Products list element not found");
        return;
    }
    
    productsList.innerHTML = '<div class="col-span-full text-center py-8">Loading products...</div>';
    
    try {
        

        // get all products from Firestore
        const snapshot = await db.collection('products').orderBy('lastUpdated', 'desc').get();
        
        // handle case if empty
        if (snapshot.empty) {
            productsList.innerHTML = '<div class="col-span-full text-center py-8">No orders found<img src="assets/images/gif-shaking-no-money-penguin.gif" alt="Penguin shaking no money" class="w-48 h-auto mx-auto"></div>';
            return;
        }
        
        // convert to array
        let products = [];
        snapshot.forEach((doc) => {
            products.push({ id: doc.id, ...doc.data() });
        });

        // apply client-side filtering
        if (filter !== 'all') {
            products = products.filter(product => product.status === filter);
        }

        // Render results
        if (products.length === 0) {
            productsList.innerHTML = `<div class="col-span-full text-center py-8">No ${filter} products found<img src="assets/images/gif-shaking-no-money-penguin.gif" alt="Penguin shaking no money" class="w-48 h-auto mx-auto"></div>`;
            return;
        }

        // Sort by lastUpdated
        products.sort((a, b) => {
            return (b.lastUpdated || 0) - (a.lastUpdated || 0);
        });



// Consider separating the rendering logic into a function for better readability
        
        // RENDER
        productsList.innerHTML = '';
        
        // RENDER PRODUCT CARD LOGIC
        products.forEach((product) => {
            const productCard = document.createElement('div');
            productCard.className = 'bg-white rounded-lg shadow-md overflow-hidden';
            
            // Get the main image (first in the images array) or use the legacy imageUrl field
            const mainImageUrl = (product.images && product.images.length > 0) 
                ? product.images[0].url 
                : (product.imageUrl || '');
            
            // Format the last updated date if available
            let lastUpdatedText = '';
            if (product.lastUpdated) {
                const date = product.lastUpdated instanceof Date ? 
                    product.lastUpdated : 
                    product.lastUpdated.toDate ? product.lastUpdated.toDate() : new Date(product.lastUpdated);
                
                lastUpdatedText = `Updated: ${date.toLocaleDateString()}`;
            }
            
            productCard.innerHTML = `
                <div class="h-48 bg-gray-100 flex items-center justify-center">
                    ${mainImageUrl ? 
                        `<img src="${mainImageUrl}" alt="${product.name}" class="h-full object-contain">` : 
                        '<div class="text-gray-400">No Image</div>'}
                </div>
                <div class="p-4">
                    <h3 class="font-bold text-lg mb-1">${product.name}</h3>
                    <p class="text-primary font-bold mb-2">$${product.price ? product.price.toFixed(2) : '0.00'}</p>
                    <p class="text-sm text-gray-600 line-clamp-2 mb-4">${product.description || 'No description'}</p>
                    <div class="flex justify-between items-center mb-2">
                        <span class="text-sm ${product.status === 'released' ? 'text-green-600' : 'text-gray-600'}">
                            ${product.status || 'unreleased'}
                        </span>
                        <span class="text-sm text-gray-500">
                            ${lastUpdatedText}
                        </span>
                    </div>
                    <div class="flex justify-between">
                        <button data-product-id="${product.id}" class="edit-product-btn text-sm bg-gray-200 hover:bg-gray-300 px-3 py-1 rounded">
                            Edit
                        </button>
                        <button data-product-id="${product.id}" class="delete-product-btn text-sm bg-red-100 hover:bg-red-200 text-red-700 px-3 py-1 rounded">
                            Delete
                        </button>
                    </div>
                </div>
            `;
            productsList.appendChild(productCard);
        });


// End of render logic

        
        // Clean up any existing event listeners to prevent duplicates
        const addProductBtn = document.getElementById('addProductBtn');
        if (addProductBtn) {
            // Clone the button to remove all event listeners
            const newAddBtn = addProductBtn.cloneNode(true);
            addProductBtn.parentNode.replaceChild(newAddBtn, addProductBtn);
            
            // Add fresh event listener
            newAddBtn.addEventListener('click', () => {
                openProductModal(); // Call with no parameters for a new product
            });
        }
        
        // Event delegation for edit and delete buttons to avoid attaching multiple listeners
        document.addEventListener('click', (e) => {
            // Handle edit button clicks
            if (e.target.classList.contains('edit-product-btn')) {
                const productId = e.target.getAttribute('data-product-id');
                if (productId) {
                    openProductModal(productId);
                }
            }
            
            // Handle delete button clicks
            if (e.target.classList.contains('delete-product-btn')) {
                const productId = e.target.getAttribute('data-product-id');
                if (productId && typeof confirmDeleteProduct === 'function') {
                    confirmDeleteProduct(productId);
                }
            }
        }, { capture: false });
        
        
// END OF TRY BLOCK

    } catch (error) {
        console.error("Error loading products:", error);
        if (productsList) {
            productsList.innerHTML = `<div class="col-span-full text-center py-8 text-red-300">Error loading products: ${error.message}<img src="assets/images/gif-surprised-corgi-detective.gif" alt="" class="w-48 h-auto mx-auto"></div>`;
        }
    }
}

        function openProductModal(productId = null) {
            const modal = document.getElementById('productModal');
            const form = document.getElementById('productForm');
            
            // Reset form and images array
            form.reset();
            currentProductImages = [];
            refreshImageGallery();
            
            document.getElementById('productId').value = '';
            
            // Set title
            document.getElementById('productModalTitle').textContent = 
                productId ? 'Edit Product' : 'Add New Product';
            
            // If editing, load product data
            if (productId) {
                db.collection('products').doc(productId).get().then(doc => {
                    if (doc.exists) {
                        const product = doc.data();
                        document.getElementById('productId').value = doc.id;
                        document.getElementById('productName').value = product.name || '';
                        document.getElementById('productPrice').value = product.price || '';
                        document.getElementById('productDescription').value = product.description || '';
                        
                        // Add status field handling
                        const statusSelect = document.getElementById('productStatus');
                        if (statusSelect) {
                            statusSelect.value = product.status || 'unreleased';
                        }
                        
                        // Handle images
                        if (product.images && Array.isArray(product.images)) {
                            // Use the new images array structure
                            currentProductImages = [...product.images];
                        } else if (product.imageUrl) {
                            // Convert legacy single imageUrl to the new format
                            currentProductImages = [{
                                url: product.imageUrl,
                                name: 'Legacy Image',
                                path: product.imagePath || ''
                            }];
                        }
                        
                        refreshImageGallery();
                        
                        // Ensure the save button is visible
                        document.getElementById('saveProductBtn').style.display = 'block';
                    }
                }).catch(error => {
                    console.error("Error getting product:", error);
                    showToast('Error loading product data. Please try again.', 'error');
                });
            } else {
                // Ensure the save button is visible for new products
                document.getElementById('saveProductBtn').style.display = 'block';
            }
            
            // Show modal
            modal.classList.remove('hidden');
        }

        // Function to refresh the image gallery based on currentProductImages
        function refreshImageGallery() {
            const gallery = document.getElementById('imageGallery');
            if (!gallery) return;
            
            // Clear all items
            gallery.innerHTML = '';
            
            // Add each image to the gallery
            currentProductImages.forEach((image, index) => {
                const imageItem = document.createElement('div');
                imageItem.className = 'image-item';
                imageItem.setAttribute('data-index', index);
                
                imageItem.innerHTML = `
                    ${index === 0 ? '<span class="main-image-badge">Main</span>' : ''}
                    <img src="${image.url}" alt="${image.name || 'Product image'}">
                    <div class="delete-image" data-index="${index}">×</div>
                `;
                
                gallery.appendChild(imageItem);
                
                // Add delete event listener
                imageItem.querySelector('.delete-image').addEventListener('click', (e) => {
                    e.stopPropagation();
                    const idx = parseInt(e.target.getAttribute('data-index'));
                    currentProductImages.splice(idx, 1);
                    refreshImageGallery();
                });
            });
            
            // Add the add button
            const addBtn = document.createElement('div');
            addBtn.id = 'addImageBtn';
            addBtn.className = 'add-image-btn';
            addBtn.innerHTML = `
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
                </svg>
            `;
            gallery.appendChild(addBtn);
            
            // Setup sortable functionality
            if (typeof Sortable !== 'undefined') {
                new Sortable(gallery, {
                    animation: 150,
                    filter: '#addImageBtn', // Don't allow dragging the add button
                    onEnd: function(evt) {
                        // Skip if we moved the add button (shouldn't happen due to filter, but just in case)
                        if (evt.item.id === 'addImageBtn') return;
                        
                        // Get old and new indices
                        const oldIndex = evt.oldIndex;
                        const newIndex = evt.newIndex;
                        
                        // Move the image in the array
                        const movedImage = currentProductImages.splice(oldIndex, 1)[0];
                        currentProductImages.splice(newIndex, 0, movedImage);
                        
                        // Refresh to update the "Main" badge
                        refreshImageGallery();
                    }
                });
            }
            
            // Add image button click handler
            const addImageBtn = document.getElementById('addImageBtn');
            if (addImageBtn) {
                addImageBtn.addEventListener('click', () => {
                    document.getElementById('productImageInput').click();
                });
            }
        }

    // Set up event listeners once DOM is loaded
    document.addEventListener('DOMContentLoaded', () => {
        // Handle image file selection
        const fileInput = document.getElementById('productImageInput');
        if (fileInput) {
            fileInput.addEventListener('change', function(e) {
                const files = e.target.files;
                if (!files.length) return;
                
                const file = files[0];
                if (!file.type.match('image.*')) {
                    showToast('Please select an image file', 'error');
                    return;
                }
                
                const reader = new FileReader();
                reader.onload = function(event) {
                    // Add the new image to the current images array
                    currentProductImages.push({
                        url: event.target.result,
                        name: file.name,
                        file: file, // Keep the file object for later upload
                        isNew: true // Flag to indicate this is a new upload
                    });
                    
                    refreshImageGallery();
                    fileInput.value = ''; // Reset the input for the next selection
                };
                
                reader.readAsDataURL(file);
            });
        }

        // Set up cancel button
        const cancelBtn = document.getElementById('cancelProductBtn');
        if (cancelBtn) {
            cancelBtn.addEventListener('click', () => {
                document.getElementById('productModal').classList.add('hidden');
            });
        }

        // Set up close button
        const closeBtn = document.getElementById('closeProductModal');
        if (closeBtn) {
            closeBtn.addEventListener('click', () => {
                document.getElementById('productModal').classList.add('hidden');
            });
        }
    });

        // Save product with multiple images
        document.addEventListener('DOMContentLoaded', () => {
            const form = document.getElementById('productForm');
            if (form) {
                form.addEventListener('submit', async function(e) {
                    e.preventDefault();
                    
                    const saveBtn = document.getElementById('saveProductBtn');
                    const cancelBtn = document.getElementById('cancelProductBtn');
                    const productId = document.getElementById('productId').value;
                    
                    if (!saveBtn || !cancelBtn) return;
                    
                    saveBtn.disabled = true;
                    cancelBtn.disabled = true;
                    saveBtn.textContent = 'Saving...';
                    
                    try {
                        const productData = {
                            name: document.getElementById('productName').value,
                            price: parseFloat(document.getElementById('productPrice').value),
                            description: document.getElementById('productDescription').value,
                            status: document.getElementById('productStatus').value,
                            lastUpdated: firebase.firestore.FieldValue.serverTimestamp()
                        };
                        
                        // Process images
                        const updatedImages = [];
                        
                        // First, upload any new images to Firebase Storage
                        for (let i = 0; i < currentProductImages.length; i++) {
                            const image = currentProductImages[i];
                            
                            if (image.isNew && image.file) {
                                try {
                                    // This is a new image that needs to be uploaded
                                    const storageRef = storage.ref();
                                    
                                    // Fix: Generate a more unique file path with safer URL encoding
                                    const timestamp = Date.now();
                                    const safeFileName = encodeURIComponent(image.name).replace(/%20/g, '_');
                                    const filePath = `products/${timestamp}_${safeFileName}`;
                                    const fileRef = storageRef.child(filePath);
                                    
                                    // Convert data URL to blob if needed
                                    let fileToUpload = image.file;
                                    if (typeof image.url === 'string' && image.url.startsWith('data:')) {
                                        // It's a data URL, convert to blob
                                        const response = await fetch(image.url);
                                        fileToUpload = await response.blob();
                                    }
                                    
                                    await fileRef.put(fileToUpload, {contentType: image.file.type});
                                    const url = await fileRef.getDownloadURL();
                                    
                                    updatedImages.push({
                                        url: url,
                                        name: image.name,
                                        path: fileRef.fullPath
                                    });
                                } catch (error) {
                                    console.error("Error uploading image:", error);
                                    // Continue with the next image instead of stopping the entire process
                                    showToast(`Error uploading image ${image.name}: ${error.message}`, 'warning');
                                }
                            } else {
                                // This is an existing image, keep it as is
                                updatedImages.push({
                                    url: image.url,
                                    name: image.name || '',
                                    path: image.path || ''
                                });
                            }
                        }
                        
                        // Update the images array in the product data
                        productData.images = updatedImages;
                        
                        // Set the first image as the main image for backward compatibility
                        if (updatedImages.length > 0) {
                            productData.imageUrl = updatedImages[0].url;
                            productData.imagePath = updatedImages[0].path;
                        } else {
                            // No images, clear the fields
                            productData.imageUrl = '';
                            productData.imagePath = '';
                        }
                        
                        // Save to Firestore
                        if (productId) {
                            // Update existing product
                            await db.collection('products').doc(productId).update(productData);
                            showToast('Product updated successfully!');
                        } else {
                            // Add new product
                            productData.createdAt = firebase.firestore.FieldValue.serverTimestamp();
                            await db.collection('products').add(productData);
                            showToast('Product added successfully!');
                        }
                        
                        // Update UI
                        setTimeout(() => {
                            document.getElementById('productModal').classList.add('hidden');
                            
                            // Get current filter value
                            const currentFilter = document.getElementById('productFilter')?.value || 'all';
                            
                            // Reload products with current filter
                            loadProducts(currentFilter);
                        }, 1000);
                        
                    } catch (error) {
                        console.error("Error saving product:", error);
                        showToast('Error saving product: ' + error.message, 'error');
                        saveBtn.textContent = 'Save';
                    } finally {
                        saveBtn.disabled = false;
                        cancelBtn.disabled = false;
                        saveBtn.textContent = 'Save';
                    }
                    
                    saveBtn.textContent = 'Save';
                    
                });
            }
        });

        // Helper function for product deletion confirmation
        function confirmDeleteProduct(productId) {
            if (!productId) return;
            
            if (confirm('Are you sure you want to delete this product?')) {
                deleteProduct(productId);
            }
        }

        // Helper function to actually delete a product
        async function deleteProduct(productId) {
            try {
                // Get the product to find any images to delete
                const productDoc = await db.collection('products').doc(productId).get();
                
                if (productDoc.exists) {
                    const product = productDoc.data();
                    
                    // First delete any associated images from storage
                    if (product.images && Array.isArray(product.images)) {
                        for (const image of product.images) {
                            if (image.path) {
                                try {
                                    await storage.ref(image.path).delete();
                                } catch (imageError) {
                                    console.warn(`Could not delete image at path ${image.path}:`, imageError);
                                }
                            }
                        }
                    } else if (product.imagePath) {
                        // Handle legacy single image
                        try {
                            await storage.ref(product.imagePath).delete();
                        } catch (imageError) {
                            console.warn(`Could not delete image at path ${product.imagePath}:`, imageError);
                        }
                    }
                    
                    // Then delete the product document
                    await db.collection('products').doc(productId).delete();
                    showToast('Product deleted successfully');
                    
                    // Reload products list
                    loadProducts();
                }
            } catch (error) {
                console.error("Error deleting product:", error);
                showToast('Error deleting product: ' + error.message, 'error');
            }
        }

        // For dateString in format "4/21/2025, 12:49:56 AM"
        function extractMonthDay(dateString) {

            const datePart = dateString.split(",")[0];
            const [month, day] = datePart.split("/");

            const monthNames = [
                "January", "February", "March", "April", "May", "June",
                "July", "August", "September", "October", "November", "December"
            ];

            return `${monthNames[parseInt(month) - 1]} ${parseInt(day)}`;
        }
