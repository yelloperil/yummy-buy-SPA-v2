<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Submit Order</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
</head>
<body class="bg-gray-100">

    <!-- Loading Overlay -->
    <div id="loadingOverlay" class="fixed inset-0 bg-gray-500 bg-opacity-75 hidden flex items-center justify-center z-50">
        <div class="animate-spin rounded-full h-32 w-32 border-t-2 border-b-2 border-gray-900"></div>
    </div>

    <!-- Confirmation Modal -->
    <div id="confirmationModal" class="fixed inset-0 bg-gray-500 bg-opacity-75 hidden flex items-center justify-center z-50">
        <div class="bg-white p-8 rounded-lg shadow-md">
            <p id="confirmationMessage" class="text-lg mb-4"></p>
            <p id="orderReference" class="text-sm mb-4"></p>
            <button onclick="document.getElementById('confirmationModal').classList.add('hidden')" class="bg-blue-500 text-white px-4 py-2 rounded">Close</button>
        </div>
    </div>

    <div class="container mx-auto p-8">
        <h1 class="text-3xl font-bold mb-6">Submit Your Order</h1>

        <form id="orderForm">
            <div class="mb-4">
                <label for="name" class="block text-gray-700">Name:</label>
                <input type="text" id="name" class="w-full border border-gray-300 px-3 py-2 rounded">
            </div>
            <div class="mb-4">
                <label for="wechat" class="block text-gray-700">WeChat:</label>
                <input type="text" id="wechat" class="w-full border border-gray-300 px-3 py-2 rounded">
            </div>
            <div class="mb-4">
                <label for="address" class="block text-gray-700">Address:</label>
                <input type="text" id="address" class="w-full border border-gray-300 px-3 py-2 rounded">
            </div>
            <div class="mb-4">
                <label for="notes" class="block text-gray-700">Notes:</label>
                <input type="text" id="notes" class="w-full border border-gray-300 px-3 py-2 rounded">
            </div>
            <div class="mb-4">
                <label for="deliveryType" class="block text-gray-700">Delivery Type:</label>
                <select id="deliveryType" class="w-full border border-gray-300 px-3 py-2 rounded">
                    <option value="pickup">Pickup</option>
                    <option value="delivery">Delivery</option>
                </select>
            </div>
             <button type="submit" id="submitOrderBtn" class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded">Submit Order</button>
        </form>
        </div>

    <script>
        // Firebase configuration (replace with your actual config)
        const firebaseConfig = {
          // YOUR CONFIG HERE
        };

        // Initialize Firebase
        const app = firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore(app);
        const auth = firebase.auth(app);

        // Global variables
        let currentUser = null;

        // Sample cart data (replace with actual cart data)
        let cart = [
            {
                product: { id: 'prod1', name: 'Product 1', price: 10 },
                quantity: 2
            },
            {
                product: { id: 'prod2', name: 'Product 2', price: 15 },
                quantity: 1
            }
        ];

        const orderForm = document.getElementById('orderForm');
        const loadingOverlay = document.getElementById('loadingOverlay');
        const confirmationModal = document.getElementById('confirmationModal');
        const confirmationMessage = document.getElementById('confirmationMessage');
        const orderReference = document.getElementById('orderReference');

        // Modified submitOrder function
        async function submitOrder(e) {
            e.preventDefault();

            // --- Move validation checks here from deprecated submitOrderBtn ---
            if (typeof isLoggedIn !== 'undefined' && !isLoggedIn) {
                document.getElementById('customAlert')?.classList.remove('hidden');
                return; // Stop execution if not logged in
            }

            const requiredFields = [
                document.getElementById('name'), 
                document.getElementById('wechat'), 
                document.getElementById('deliveryType')
            ].filter(el => el !== null);
            
            const allFilled = requiredFields.every(field => field.value.trim() !== '');
            if (!allFilled) {
                showToast("Please fill out all required fields.", 'error');
                return; // Stop execution if validation fails
            }
            
            // Show loading overlay
            loadingOverlay.classList.remove('hidden');

            // Get form data
            const customerData = {
                name: document.getElementById('name').value,
                wechat: document.getElementById('wechat').value,
                address: document.getElementById('address').value,
                notes: document.getElementById('notes').value,
                userId: currentUser ? currentUser.uid : null, // Add user ID if logged in
                phone: currentUser ? currentUser.phoneNumber : null, // Add phone number if available
                deliveryType: document.getElementById('deliveryType').value
            };
            
            // Format order items
            const orderItems = cart.map(item => ({
                productId: item.product.id,
                productName: item.product.name,
                price: item.product.price,
                quantity: item.quantity,
                subtotal: (item.product.price * item.quantity).toFixed(2)
            }));
            
            // Calculate total
            let total = 0;
            cart.forEach(item => {
                total += item.product.price * item.quantity;
            });
            
            // Create order document
            const orderData = {
                customer: customerData,
                items: orderItems,
                total: total.toFixed(2),
                orderDate: new Date().toISOString(),
                status: 'order placed',
                lastUpdated: firebase.firestore.FieldValue.serverTimestamp()
            };

            try {
                // Add order to Firestore
                const docRef = await db.collection('orders').add(orderData);
                
                // Hide loading overlay
                loadingOverlay.classList.add('hidden');
                
                // Show confirmation modal
                confirmationMessage.textContent = `Thank you ${customerData.name}! Your order #${docRef.id} has been received.`;
                orderReference.textContent = `Order Reference: ${docRef.id}`;
                confirmationModal.classList.remove('hidden');
                
                // Reset form and cart
                orderForm.reset();
                clearCart();
                
            } catch (error) {
                console.error("Error submitting order:", error);
                loadingOverlay.classList.add('hidden');
                alert("There was an error processing your order. Please try again.");
            }
        }

        // Add product to cart
        async function addToCart(e) {
            const productId = e.target.dataset.productId;
            const quantityInput = document.querySelector(`.qty-input[data-product-id="${productId}"]`);
            const quantity = parseInt(quantityInput.value);
            
            try {
                // Get product from cache instead of Firestore
                const product = productCache.get(productId);
                
                if (!product) {
                    showToast('Product not found', 'error');
                    return;
                }
                
                // Check if product is already in cart
                const existingItem = cart.find(item => item.product.id === productId);
                
                if (existingItem) {
                    existingItem.quantity += quantity;
            } else {
                    cart.push({
                        product,
                        quantity
                    });
                }
                
                // Reset quantity input
                quantityInput.value = 1;
                
                // Update cart display
                updateCartDisplay();
                
                // Show feedback
                const button = e.target;
                const originalText = button.textContent;
                button.textContent = 'Added!';
                button.classList.remove('bg-primary', 'hover:bg-secondary');
                button.classList.add('bg-green-500');
                
                setTimeout(() => {
                    button.textContent = originalText;
                    button.classList.add('bg-primary', 'hover:bg-secondary');
                    button.classList.remove('bg-green-500');
                }, 1000);
                
            } catch (error) {
                console.error("Error adding to cart:", error);
                showToast('Error adding to cart: ' + error.message, 'error');
            }
        }

        // Update cart display
        function updateCartDisplay() {
            if (cart.length === 0) {
                emptyCartImage.classList.remove('hidden');
                emptyCartMessage.style.display = 'block';
                cartItems.innerHTML = '';
                cartTotal.textContent = 'Total: $0.00';
            } else {
                emptyCartImage.classList.add('hidden');
                emptyCartMessage.style.display = 'none';
                
                let cartHTML = '';
                let total = 0;
                
                cart.forEach((item, index) => {
                    const itemTotal = item.product.price * item.quantity;
                    total += itemTotal;

                    cartHTML += `
                        <div class="flex items-center justify-between p-2 mb-2 ${index !== 0 ? 'border-t border-gray-200 dark:border-gray-700' : ''} rounded-md bg-white dark:bg-gray-800 transition-transform transform hover:scale-105 hover:shadow-lg w-full">
                            <div class="flex items-center gap-3 flex-grow">
                                <div class="flex-shrink-0 bg-gray-100 dark:bg-gray-700 rounded-md flex items-center justify-center overflow-hidden">
                                    ${item.product.imageUrl ? 
                                    `<img src="${item.product.imageUrl}" alt="${item.product.name}" class="h-8 object-contain">` : 
                                    '<div class="text-gray-400 text-xs">No Image</div>'}
                                </div>
                                <div class="flex-grow">
                                    <h4 class="font-medium text-sm">${item.product.name}</h4>
                                    <div class="text-sm text-gray-600 dark:text-gray-400">
                                        $${item.product.price.toFixed(2)} × ${item.quantity}
                                    </div>
                                </div>
                            </div>
                            <div class="flex-shrink-0">
                                <button data-index="${index}" class="remove-item text-red-500 hover:text-red-700 text-sm bg-transparent border border-red-500 rounded-md px-2 py-1 transition-colors hover:bg-red-500 hover:text-white">
                                    Remove
                                </button>
                            </div>
                        </div>
                    `;
                    
                });
                
                cartItems.innerHTML = cartHTML;
                cartTotal.textContent = `Total: $${total.toFixed(2)}`;
                
                // Add event listeners for remove buttons
                document.querySelectorAll('.remove-item').forEach(button => {
                    button.addEventListener('click', removeFromCart);
                });
            }
        }

        // Remove item from cart
        function removeFromCart(e) {
            const index = parseInt(e.target.dataset.index);
            cart.splice(index, 1);
            updateCartDisplay();
        }

        // Clear cart
        function clearCart() {
            cart = [];
            updateCartDisplay();
            // Reset delivery type to default
            const deliveryTypeSelect = document.getElementById('deliveryType');
            deliveryTypeSelect.value = 'Pickup';
            handleDeliveryTypeChange();
        }

        // Event listener for form submission
        orderForm.addEventListener('submit', submitOrder);
        
       
    </script>
</body>
</html>
