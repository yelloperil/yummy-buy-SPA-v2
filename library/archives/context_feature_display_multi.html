<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yummy Buy</title>
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

    <!-- Tailwind CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <script>
        tailwind.config = {
            darkMode: 'class',
                theme: {
                    extend: {
                        colors: {
                            primary: '#5D5CDE',
                            secondary: '#A5A4FF',
                        },
                        keyframes: {
                            'pulse-glow': {
                            '0%, 100%': { filter: 'drop-shadow(0 0 10px rgba(173, 216, 230, 0.7))' },
                            '50%': { filter: 'drop-shadow(0 0 15px rgba(173, 216, 230, 0.9))' },
                            }
                        },
                        animation: {
                            // name: keyframes   duration   timing   iterations
                            'pulse-glow': 'pulse-glow 3s   ease-in-out infinite',
                        },                                                
                    },
                },
        };

        // Check for dark mode preference
        if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
            document.documentElement.classList.add('dark');
        }
        window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', event => {
            document.documentElement.classList.toggle('dark', event.matches);
        });
    </script>

    <style>
        .order-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }
        .tab-active {
            border-bottom: 3px solid #5D5CDE;
            font-weight: 600;
        }
        /* Add toast styles here */
        .toast {
            transition: all 0.3s ease;
            opacity: 0;
            transform: translateY(20px);
        }
        .toast.show {
            opacity: 1;
            transform: translateY(0);
        }
        .product-image-container {
            width: 200px; /* Set a fixed width */
            height: 200px; /* Set a fixed height */
            overflow: hidden; /* Hide overflow */
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #f0f0f0; /* Optional: background color for empty images */
        }

        .product-image-container img {
            width: 100%; /* Scale image to fit the container */
            height: auto; /* Maintain aspect ratio */
            object-fit: cover; /* Cover the container while maintaining aspect ratio */
        }
    </style>
</head>

<body class="bg-white dark:bg-gray-900 text-gray-800 dark:text-gray-200 min-h-screen transition-colors duration-300">
    
    <!-- @@@ OUTER WRAPPER Outer Wrapper -->
    <div class="container mx-auto px-4 py-8">
    
    <!-- @@@ MAIN BODY SECTION -->
        
        <!-- Version 5.0 - Product Catalogue Section, Shopping Cart Section, Order Section -->
        <div class="flex flex-col lg:flex-row gap-8">

            <!-- Product Catalogue Section -->
            <div class="lg:w-2/3">
                <div class="bg-white dark:bg-gray-800 rounded-lg shadow-md p-4 mb-6">
                    <h2 class="text-xl font-semibold mb-4">Product Catalogue</h2>
                    <div class="mb-4">
                        <input type="text" id="searchInput" placeholder="Search products..." 
                            class="w-full p-2 border border-gray-300 dark:border-gray-600 rounded-md bg-white dark:bg-gray-700 text-base">
                    </div>
                    <div id="productList" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <!-- Products will be inserted here by JavaScript -->
                    </div>
                </div>
            </div>

        </div>

    </div>

    <script>
        // Firebase Configuration
        const firebaseConfig = {
          apiKey: "AIzaSyCTUZbw1qSdFEBG2SGo7smQgqXEKZZWCaw",
          authDomain: "mei-wen-ti.firebaseapp.com",
          projectId: "mei-wen-ti",
          storageBucket: "mei-wen-ti.firebasestorage.app",
          messagingSenderId: "103509830524",
          appId: "1:103509830524:web:5ddef022db357ce99152f9",
        };
        
        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore(); // Add Firestore reference
        const auth = firebase.auth();
        
        // Initialize cart
        let cart = [];
        
        // Initialize cart-related DOM elements
        const cartItems = document.getElementById('cartItems');
        const cartTotal = document.getElementById('cartTotal');
        const clearCartBtn = document.getElementById('clearCartBtn');
        const closeModalBtn = document.getElementById('closeModalBtn');
        const confirmationMessage = document.getElementById('confirmationMessage');
        const confirmationModal = document.getElementById('confirmationModal');
        const emptyCartImage = document.getElementById('emptyCartImage');
        const emptyCartMessage = document.getElementById('emptyCartMessage');
        const loadingOverlay = document.getElementById('loadingOverlay');
        const orderForm = document.getElementById('orderForm');
        const orderReference = document.getElementById('orderReference');
        const productList = document.getElementById('productList');
        const searchInput = document.getElementById('searchInput');
        const submitOrderBtn = document.getElementById('submitOrderBtn');

        // Toast function
        function showToast(message, type = 'success') {
            const toast = document.createElement('div');
            toast.className = `fixed bottom-4 right-4 p-4 rounded-lg shadow-lg ${
                type === 'success' ? 'bg-green-500' : 'bg-red-500'
            } text-white transition-all duration-300 transform translate-y-20 opacity-0`;
            
            toast.textContent = message;
            document.body.appendChild(toast);
            
            // Show toast
            setTimeout(() => {
                toast.classList.remove('translate-y-20', 'opacity-0');
                toast.classList.add('translate-y-0', 'opacity-100');
            }, 100);
            
            // Hide toast after 3 seconds
            setTimeout(() => {
                toast.classList.remove('translate-y-0', 'opacity-100');
                toast.classList.add('translate-y-20', 'opacity-0');
                
                // Remove toast from DOM after animation
                setTimeout(() => {
                    document.body.removeChild(toast);
                }, 300);
            }, 3000);
        }
        

        // Product cache
        let productCache = new Map();

        // Display products
        async function displayProducts() {
            productList.innerHTML = '<div class="flex flex-col h-full bg-white dark:bg-gray-800 rounded-lg shadow-md overflow-hidden">Loading...</div>';
            
            try {
                const snapshot = await db.collection('products').orderBy('name').get();
                
                if (snapshot.empty) {
                    productList.innerHTML = '<div class="col-span-full text-center py-8">No products available</div>';
                    return;
                }
                
                // Clear existing cache
                productCache.clear();
                
                productList.innerHTML = '';
                snapshot.forEach((doc) => {
                    const product = {
                        id: doc.id,
                        ...doc.data()
                    };
                    
                    // Cache the product
                    productCache.set(doc.id, product);
                    
                    const productCard = document.createElement('div');
                    productCard.className = 'w-full h-full border border-gray-200 dark:border-gray-700 rounded-lg overflow-hidden transition-all hover:shadow-md';
                    // productCard.className = 'w-full h-full border border-gray-200 dark:border-gray-700 rounded-lg overflow-hidden transition-all hover:shadow-md';


                    productCard.innerHTML = `
                        <div class="bg-gray-100 dark:bg-gray-700 h-[250px] p-4 pb-0 overflow-hidden">
                            ${product.imageUrl ? `
                                <img 
                                    src="${product.imageUrl}" 
                                    alt="${product.name}" 
                                    class="w-full h-full object-cover rounded-t-lg"
                                >
                            ` : `
                                <div class="h-full flex items-center justify-center text-gray-400">No Image</div>
                            `}
                        </div>

                        <div class="p-4 flex flex-col flex-grow justify-between">
                            <h3 class="text-white text-lg font-semibold mr-auto border-b border-[#f13dc3] pr-0.5 pb-1.5">${product.name}</h3>
                            <p class="text-base font-semibold my-2 pt-2 mb-1">$${product.price.toFixed(2)}</p>
                            <p class="text-sm text-gray-600 dark:text-gray-400 mb-3">${product.description}</p>
                            <div class="flex justify-between items-center mt-auto">
                                <!-- Quantity Controls -->
                                <div class="flex items-center">
                                    <button data-product-id="${doc.id}" class="decrease-qty bg-gray-200 dark:bg-gray-700 w-8 h-8 flex items-center justify-center rounded-l-md">-</button>
                                    <input type="number" min="1" value="1" class="qty-input w-12 h-8 text-center border-y border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-800 text-base" data-product-id="${doc.id}">
                                    <button data-product-id="${doc.id}" class="increase-qty bg-gray-200 dark:bg-gray-700 w-8 h-8 flex items-center justify-center rounded-r-md">+</button>
                                </div>
                                <!-- Cart Button -->
                                <button data-product-id="${doc.id}" class="add-to-cart bg-primary hover:bg-secondary text-white py-1 px-3 rounded-md text-sm">
                                    Add to Cart
                                </button>
                            </div>
                        </div>
                    `;
           
                    productList.appendChild(productCard);
                });

                // Add event listeners for product cards
                document.querySelectorAll('.add-to-cart').forEach(button => {
                    button.addEventListener('click', addToCart);
                });

                document.querySelectorAll('.increase-qty').forEach(button => {
                    button.addEventListener('click', (e) => {
                        const id = e.target.dataset.productId;
                        const input = document.querySelector(`.qty-input[data-product-id="${id}"]`);
                        input.value = parseInt(input.value) + 1;
                    });
                });

                document.querySelectorAll('.decrease-qty').forEach(button => {
                    button.addEventListener('click', (e) => {
                        const id = e.target.dataset.productId;
                        const input = document.querySelector(`.qty-input[data-product-id="${id}"]`);
                        if (parseInt(input.value) > 1) {
                            input.value = parseInt(input.value) - 1;
                        }
                    });
                });
                
            } catch (error) {
                console.error("Error loading products:", error);
                productList.innerHTML = `<div class="col-span-full text-center py-8 text-red-500">Error loading products: ${error.message}</div>`;
            }
        }

        // Add product to cart
        async function addToCart(e) {
            const productId = e.target.dataset.productId;
            const quantityInput = document.querySelector(`.qty-input[data-product-id="${productId}"]`);
            const quantity = parseInt(quantityInput.value);
            
            try {
                // Get product from cache instead of Firestore
                const product = productCache.get(productId);
                
                if (!product) {
                    showToast('Product not found', 'error');
                    return;
                }
                
                // Check if product is already in cart
                const existingItem = cart.find(item => item.product.id === productId);
                
                if (existingItem) {
                    existingItem.quantity += quantity;
                } else {
                    cart.push({
                        product,
                        quantity
                    });
                }
                
                // Reset quantity input
                quantityInput.value = 1;
                
                // Update cart display
                updateCartDisplay();
                
                // Show feedback
                const button = e.target;
                const originalText = button.textContent;
                button.textContent = 'Added!';
                button.classList.remove('bg-primary', 'hover:bg-secondary');
                button.classList.add('bg-green-500');
                
                setTimeout(() => {
                    button.textContent = originalText;
                    button.classList.add('bg-primary', 'hover:bg-secondary');
                    button.classList.remove('bg-green-500');
                }, 1000);
                
            } catch (error) {
                console.error("Error adding to cart:", error);
                showToast('Error adding to cart: ' + error.message, 'error');
            }
        }

        // Update cart display
        function updateCartDisplay() {
            if (cart.length === 0) {
                emptyCartImage.classList.remove('hidden');
                emptyCartMessage.style.display = 'block';
                cartItems.innerHTML = '';
                cartTotal.textContent = 'Total: $0.00';
                clearCartBtn.disabled = true;
                submitOrderBtn.disabled = true;
            } else {
                emptyCartImage.classList.add('hidden');
                emptyCartMessage.style.display = 'none';
                
                let cartHTML = '';
                let total = 0;
                
                cart.forEach((item, index) => {
                    const itemTotal = item.product.price * item.quantity;
                    total += itemTotal;

                    cartHTML += `
                        <div class="flex items-center justify-between p-2 mb-2 ${index !== 0 ? 'border-t border-gray-200 dark:border-gray-700' : ''} rounded-md bg-white dark:bg-gray-800 transition-transform transform hover:scale-105 hover:shadow-lg w-full">
                            <div class="flex items-center gap-3 flex-grow">
                                <div class="flex-shrink-0 bg-gray-100 dark:bg-gray-700 rounded-md flex items-center justify-center overflow-hidden">
                                    ${item.product.imageUrl ? 
                                    `<img src="${item.product.imageUrl}" alt="${item.product.name}" class="h-8 object-contain">` : 
                                    '<div class="text-gray-400 text-xs">No Image</div>'}
                                </div>
                                <div class="flex-grow">
                                    <h4 class="font-medium text-sm">${item.product.name}</h4>
                                    <div class="text-sm text-gray-600 dark:text-gray-400">
                                        $${item.product.price.toFixed(2)} × ${item.quantity}
                                    </div>
                                </div>
                            </div>
                            <div class="flex-shrink-0">
                                <button data-index="${index}" class="remove-item text-red-500 hover:text-red-700 text-sm bg-transparent border border-red-500 rounded-md px-2 py-1 transition-colors hover:bg-red-500 hover:text-white">
                                    Remove
                                </button>
                            </div>
                        </div>
                    `;
                    
                });
                
                cartItems.innerHTML = cartHTML;
                cartTotal.textContent = `Total: $${total.toFixed(2)}`;
                clearCartBtn.disabled = false;
                submitOrderBtn.disabled = false;
                
                // Add event listeners for remove buttons
                document.querySelectorAll('.remove-item').forEach(button => {
                    button.addEventListener('click', removeFromCart);
                });
            }
        }

        // Remove item from cart
        function removeFromCart(e) {
            const index = parseInt(e.target.dataset.index);
            cart.splice(index, 1);
            updateCartDisplay();
        }

        // Clear cart
        function clearCart() {
            cart = [];
            updateCartDisplay();
            // Reset delivery type to default
            const deliveryTypeSelect = document.getElementById('deliveryType');
            deliveryTypeSelect.value = 'Pickup';
            handleDeliveryTypeChange();
        }

        // Search functionality
        async function searchProducts() {
            const searchTerm = searchInput.value.toLowerCase();
            try {
                const snapshot = await db.collection('products').orderBy('name').get();
                const filteredProducts = [];
                
                snapshot.forEach((doc) => {
                    const product = doc.data();
                    if (product.name.toLowerCase().includes(searchTerm) || 
                        (product.description && product.description.toLowerCase().includes(searchTerm))) {
                        filteredProducts.push({
                            id: doc.id,
                            ...product
                        });
                    }
                });
                
                // Update the product list display with filtered results
                productList.innerHTML = '';
                filteredProducts.forEach(product => {
                    const productCard = document.createElement('div');
                    productCard.className = 'w-full h-full border border-gray-200 dark:border-gray-700 rounded-lg overflow-hidden transition-all hover:shadow-md';

                    productCard.innerHTML = `
                        <div class="bg-gray-100 dark:bg-gray-700 h-[250px] p-2 pb-0 overflow-hidden">
                            ${product.imageUrl ? `
                                <img 
                                    src="${product.imageUrl}" 
                                    alt="${product.name}" 
                                    class="w-full h-full object-cover rounded-t-lg"
                                >
                            ` : `
                                <div class="h-full flex items-center justify-center text-gray-400">No Image</div>
                            `}
                        </div>

                        <div class="p-4 flex flex-col flex-grow justify-between">
                            <h3 class="text-white text-lg font-semibold mr-auto border-b border-[#f13dc3] pr-0.5 pb-1.5">${product.name}</h3>
                            <p class="text-base font-semibold my-2 pt-2 mb-1">$${product.price.toFixed(2)}</p>
                            <p class="text-sm text-gray-600 dark:text-gray-400 mb-3">${product.description}</p>
                            <div class="flex justify-between items-center mt-auto">
                                <!-- Quantity Controls -->
                                <div class="flex items-center">
                                    <button data-product-id="${product.id}" class="decrease-qty bg-gray-200 dark:bg-gray-700 w-8 h-8 flex items-center justify-center rounded-l-md">-</button>
                                    <input type="number" min="1" value="1" class="qty-input w-12 h-8 text-center border-y border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-800 text-base" data-product-id="${product.id}">
                                    <button data-product-id="${product.id}" class="increase-qty bg-gray-200 dark:bg-gray-700 w-8 h-8 flex items-center justify-center rounded-r-md">+</button>
                                </div>
                                <!-- Cart Button -->
                                <button data-product-id="${product.id}" class="add-to-cart bg-primary hover:bg-secondary text-white py-1 px-3 rounded-md text-sm">
                                    Add to Cart
                                </button>
                            </div>
                        </div>
                    `;
                    
                    productList.appendChild(productCard);
                });

                // Add event listeners for the new product cards
                document.querySelectorAll('.add-to-cart').forEach(button => {
                    button.addEventListener('click', addToCart);
                });

                document.querySelectorAll('.increase-qty').forEach(button => {
                    button.addEventListener('click', (e) => {
                        const id = e.target.dataset.productId;
                        const input = document.querySelector(`.qty-input[data-product-id="${id}"]`);
                        input.value = parseInt(input.value) + 1;
                    });
                });

                document.querySelectorAll('.decrease-qty').forEach(button => {
                    button.addEventListener('click', (e) => {
                        const id = e.target.dataset.productId;
                        const input = document.querySelector(`.qty-input[data-product-id="${id}"]`);
                        if (parseInt(input.value) > 1) {
                            input.value = parseInt(input.value) - 1;
                        }
                    });
                });

            } catch (error) {
                console.error("Error searching products:", error);
                productList.innerHTML = `<div class="col-span-full text-center py-8 text-red-500">Error searching products: ${error.message}</div>`;
            }
        }

        // Event listeners
        clearCartBtn.addEventListener('click', clearCart);
        orderForm.addEventListener('submit', submitOrder);
        closeModalBtn.addEventListener('click', () => {
            confirmationModal.classList.add('hidden');
        });
        searchInput.addEventListener('input', searchProducts);

        // Initialize
        displayProducts();
        updateCartDisplay();

        // Updated submitOrderBtn click event
        submitOrderBtn.addEventListener('click', (e) => {
            // Prevent default form submission
            e.preventDefault();

            ///////////////////////////////////////////////////////////////////////////////////////////////////////
            // Check if the user is logged in
            if (!isLoggedIn) {

                // Show custom alert modal
                document.getElementById('customAlert').classList.remove('hidden');

                return;
            }
            ///////////////////////////////////////////////////////////////////////////////////////////////////////

            // Check if required fields are filled
            const requiredFields = [document.getElementById('name'), document.getElementById('wechat'), document.getElementById('deliveryType')];
            const allFilled = requiredFields.every(field => field.value.trim() !== '');
            
            if (!allFilled) {
                alert("&excl; Please fill out all required fields.");
                return;
            }

            // If all checks pass, proceed with form submission
            orderForm.submit();
        });

    </script>

    </body>
    
</html>
