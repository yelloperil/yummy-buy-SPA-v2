<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-storage-compat.js"></script>

</head>
<body class="bg-gray-100 min-h-screen">
    <div class="container mx-auto px-4 py-8">
        <!-- Products Section (Hidden by default) -->
        <div id="productsSection" class="hidden">
            <!-- Product management UI will go here -->
            <div class="mb-6 flex justify-between">
                <h2 class="text-2xl font-semibold">Product Management</h2>
                <button id="addProductBtn" class="bg-primary hover:bg-secondary text-white px-4 py-2 rounded-md">
                    Add New Product
                </button>
            </div>
            
            <div id="productsList" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                <!-- Products will be loaded here -->
            </div>
        </div>

        <!-- Toast Container -->
        <div id="toastContainer" class="fixed bottom-4 right-4 z-50"></div>
    </div>

    <!-- Order Detail Modal -->
    <div id="orderDetailModal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center hidden z-50">
        <div class="bg-white rounded-lg p-6 max-w-4xl w-full max-h-screen overflow-y-auto">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-xl font-bold">Order Details</h3>
                <button id="closeOrderModal" class="text-gray-500 hover:text-gray-700">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                    </svg>
                </button>
            </div>
            <div id="orderDetailContent"></div>
        </div>
    </div>

    <!-- Add/Edit Product Modal -->
    <div id="productModal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center hidden z-50">
        <div class="bg-white rounded-lg p-6 max-w-2xl w-full">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-xl font-bold" id="productModalTitle">Add New Product</h3>
                <button id="closeProductModal" class="text-gray-500 hover:text-gray-700">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                    </svg>
                </button>
            </div>
            <!-- Update the product form in the HTML section -->
            <form id="productForm" class="space-y-4">
                <input type="hidden" id="productId">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label for="productName" class="block mb-1">Product Name</label>
                        <input type="text" id="productName" required class="w-full p-2 border rounded-md">
                    </div>
                    <div>
                        <label for="productPrice" class="block mb-1">Price</label>
                        <input type="number" id="productPrice" step="0.01" required class="w-full p-2 border rounded-md">
                    </div>
                </div>
                <div>
                    <label for="productStatus" class="block mb-1">Status</label>
                    <select id="productStatus" class="w-full p-2 border rounded-md">
                        <option value="unreleased">Unreleased</option>
                        <option value="released">Released</option>
                    </select>
                </div>
                <div>
                    <label for="productDescription" class="block mb-1">Description</label>
                    <textarea id="productDescription" rows="3" class="w-full p-2 border rounded-md"></textarea>
                </div>
                <div>
                    <label for="productImage" class="block mb-1">Image</label>
                    <input type="file" id="productImage" accept="image/*" class="w-full p-2 border rounded-md">
                    <div id="imagePreview" class="mt-2 hidden">
                        <img id="previewImage" class="h-32 object-contain">
                    </div>
                </div>
                <div class="flex justify-end space-x-2">
                    <button type="button" id="cancelProductBtn" class="bg-gray-300 hover:bg-gray-400 px-4 py-2 rounded-md">
                        Cancel
                    </button>
                    <button type="submit" id="saveProductBtn" class="bg-primary hover:bg-secondary text-white px-4 py-2 rounded-md">
                        Save Product
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // Firebase Configuration
        const firebaseConfig = {
          apiKey: "AIzaSyCTUZbw1qSdFEBG2SGo7smQgqXEKZZWCaw",
          authDomain: "mei-wen-ti.firebaseapp.com",
          projectId: "mei-wen-ti",
          storageBucket: "mei-wen-ti.firebasestorage.app",
          messagingSenderId: "103509830524",
          appId: "1:103509830524:web:5ddef022db357ce99152f9",
        };

        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth();

        // Order Loading Functions
        async function loadOrders(viewType) {
            const ordersContainer = document.getElementById('ordersContainer');
            ordersContainer.innerHTML = '<div class="col-span-full text-center py-8">Loading orders...</div>';
            
            try {
                let query = db.collection('orders').orderBy('orderDate', 'desc');
                const statusFilter = document.getElementById('statusFilter').value;
                const dateFilter = document.getElementById('dateFilter').value;
                
                // Apply filters
                if (statusFilter !== 'all') {
                    query = query.where('status', '==', statusFilter);
                }
                if (dateFilter) {
                    const startDate = new Date(dateFilter);
                    const endDate = new Date(startDate);
                    endDate.setDate(endDate.getDate() + 1);
                    query = query.where('orderDate', '>=', startDate.toISOString())
                                .where('orderDate', '<', endDate.toISOString());
                }
                
                const snapshot = await query.get();
                
                if (snapshot.empty) {
                    ordersContainer.innerHTML = '<div class="col-span-full text-center py-8">No orders found</div>';
                    return;
                }
                
                let orders = [];
                snapshot.forEach(doc => {
                    orders.push({ id: doc.id, ...doc.data() });
                });
                
                // Group orders based on view type
                switch(viewType) {
                    case 'user':
                        displayOrdersByUser(orders);
                        break;
                    case 'product':
                        displayOrdersByProduct(orders);
                        break;
                    default:
                        displayChronologicalOrders(orders);
                }
                
            } catch (error) {
                console.error("Error loading orders:", error);
                ordersContainer.innerHTML = `<div class="col-span-full text-center py-8 text-red-500">Error loading orders: ${error.message}</div>`;
            }
        }
        
////////////////////////////////////////////////////////////////////////////////////////
////////////////////////////////////////////////////////////////////////////////////////

        // ### Product Management Functions ### <nav>@@@</nav>

////////////////////////////////////////////////////////////////////////////////////////
////////////////////////////////////////////////////////////////////////////////////////

        // Product Management Functions
        async function loadProducts() {
            const productsList = document.getElementById('productsList');
            productsList.innerHTML = '<div class="col-span-full text-center py-8">Loading products...</div>';
            
            try {
                const snapshot = await db.collection('products').orderBy('name').get();
                
                if (snapshot.empty) {
                    productsList.innerHTML = '<div class="col-span-full text-center py-8">No products found</div>';
                    return;
                }
                
                productsList.innerHTML = '';
                snapshot.forEach((doc) => {
                    const product = doc.data();
                    const productCard = document.createElement('div');
                    productCard.className = 'bg-white rounded-lg shadow-md overflow-hidden';
                    productCard.innerHTML = `
                        <div class="h-48 bg-gray-100 flex items-center justify-center">
                            ${product.imageUrl ? 
                                `<img src="${product.imageUrl}" alt="${product.name}" class="h-full object-contain">` : 
                                '<div class="text-gray-400">No Image</div>'}
                        </div>
                        <div class="p-4">
                            <h3 class="font-bold text-lg mb-1">${product.name}</h3>
                            <p class="text-primary font-bold mb-2">$${product.price.toFixed(2)}</p>
                            <p class="text-sm text-gray-600 line-clamp-2 mb-4">${product.description || 'No description'}</p>
                            <div class="flex justify-between items-center mb-2">
                                <span class="text-sm ${product.status === 'released' ? 'text-green-600' : 'text-gray-600'}">
                                    ${product.status || 'unreleased'}
                                </span>
                            </div>
                            <div class="flex justify-between">
                                <button data-product-id="${doc.id}" class="edit-product-btn text-sm bg-gray-200 hover:bg-gray-300 px-3 py-1 rounded">
                                    Edit
                                </button>
                                <button data-product-id="${doc.id}" class="delete-product-btn text-sm bg-red-100 hover:bg-red-200 text-red-700 px-3 py-1 rounded">
                                    Delete
                                </button>
                            </div>
                        </div>
                    `;
                    productsList.appendChild(productCard);
                });
                
                // Add event listeners

                    // for Add Product button
                document.getElementById('addProductBtn').addEventListener('click', () => {
                    openProductModal(); // Call with no parameters for a new product
                });

                    // for Edit button
                document.querySelectorAll('.edit-product-btn').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        const productId = e.target.getAttribute('data-product-id');
                        openProductModal(productId);
                    });
                });
                
                    // for Delete button
                document.querySelectorAll('.delete-product-btn').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        const productId = e.target.getAttribute('data-product-id');
                        confirmDeleteProduct(productId);
                    });
                });
                
            } catch (error) {
                console.error("Error loading products:", error);
                productsList.innerHTML = `<div class="col-span-full text-center py-8 text-red-500">Error loading products: ${error.message}</div>`;
            }
        }

        function openProductModal(productId = null) {
            const modal = document.getElementById('productModal');
            const form = document.getElementById('productForm');
            const imagePreview = document.getElementById('imagePreview');
            
            // Reset form
            form.reset();
            imagePreview.classList.add('hidden');
            document.getElementById('productId').value = '';
            
            // Set title
            document.getElementById('productModalTitle').textContent = 
                productId ? 'Edit Product' : 'Add New Product';
            
            // If editing, load product data
            if (productId) {
                db.collection('products').doc(productId).get().then(doc => {
                    if (doc.exists) {
                        const product = doc.data();
                        document.getElementById('productId').value = doc.id;
                        document.getElementById('productName').value = product.name || '';
                        document.getElementById('productPrice').value = product.price || '';
                        document.getElementById('productDescription').value = product.description || '';
                        
                        // Add status field handling
                        const statusSelect = document.getElementById('productStatus');
                        if (statusSelect) {
                            statusSelect.value = product.status || 'unreleased';
                        }
                        
                        if (product.imageUrl) {
                            document.getElementById('previewImage').src = product.imageUrl;
                            imagePreview.classList.remove('hidden');
                        }
                        
                        // Ensure the save button is visible
                        document.getElementById('saveProductBtn').style.display = 'block';
                    }
                }).catch(error => {
                    console.error("Error getting product:", error);
                    alert('Error loading product data. Please try again.');
                });
            } else {
                // Ensure the save button is visible for new products
                document.getElementById('saveProductBtn').style.display = 'block';
            }
            
            // Show modal
            modal.classList.remove('hidden');
        }

        // Handle image preview
        document.getElementById('productImage').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    document.getElementById('previewImage').src = event.target.result;
                    document.getElementById('imagePreview').classList.remove('hidden');
                };
                reader.readAsDataURL(file);
            }
        });

        // Save product
        document.getElementById('productForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const saveBtn = document.getElementById('saveProductBtn');
            const cancelBtn = document.getElementById('cancelProductBtn');
            const productId = document.getElementById('productId').value;
            
            saveBtn.disabled = true;
            cancelBtn.disabled = true;
            saveBtn.textContent = 'Saving...';
            
            try {
                const productData = {
                    name: document.getElementById('productName').value,
                    price: parseFloat(document.getElementById('productPrice').value),
                    description: document.getElementById('productDescription').value,
                    status: document.getElementById('productStatus').value,
                    lastUpdated: firebase.firestore.FieldValue.serverTimestamp()
                };
                
                // Handle image upload if a file was selected
                const imageFile = document.getElementById('productImage').files[0];
                if (imageFile) {
                    const storageRef = firebase.storage().ref();
                    const fileRef = storageRef.child(`products/${Date.now()}_${imageFile.name}`);
                    await fileRef.put(imageFile);
                    productData.imageUrl = await fileRef.getDownloadURL();
                }
                
                // Save to Firestore
                if (productId) {
                    // Update existing product
                    await db.collection('products').doc(productId).update(productData);
                    
                    // Show success message
                    showToast('Product updated successfully!');
                } else {
                    // Add new product
                    productData.createdAt = firebase.firestore.FieldValue.serverTimestamp();
                    await db.collection('products').add(productData);
                    
                    // Show success message
                    showToast('Product added successfully!');
                }
                
                // Update UI
                saveBtn.textContent = 'Saved!';
                setTimeout(() => {
                    document.getElementById('closeProductModal').click();
                    loadProducts(); // Reload products to show changes
                }, 1000);
                
            } catch (error) {
                console.error("Error saving product:", error);
                showToast('Error saving product: ' + error.message, 'error');
                saveBtn.textContent = 'Save Product';
                saveBtn.disabled = false;
                cancelBtn.disabled = false;
            }
        });

        // Delete product
        function confirmDeleteProduct(productId) {
            if (confirm('Are you sure you want to delete this product? This action cannot be undone.')) {
                db.collection('products').doc(productId).delete()
                    .then(() => {
                        loadProducts();
                    })
                    .catch(error => {
                        console.error("Error deleting product:", error);
                        alert('Error deleting product. Please try again.');
                    });
            }
        }

        // Modal close handlers
        document.getElementById('closeProductModal').addEventListener('click', () => {
            document.getElementById('productModal').classList.add('hidden');
        });

        document.getElementById('cancelProductBtn').addEventListener('click', () => {
            document.getElementById('productModal').classList.add('hidden');
        });

    </script>
</body>
</html>
