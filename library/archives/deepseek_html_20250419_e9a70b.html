<script>
    // Firebase Configuration
    const firebaseConfig = {
        apiKey: "YOUR_API_KEY",
        authDomain: "your-app.firebaseapp.com",
        projectId: "your-project-id",
        storageBucket: "your-app.appspot.com",
        messagingSenderId: "your-messaging-sender-id",
        appId: "your-app-id"
    };
    
    // Initialize Firebase
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore(); // Add Firestore reference
    
    // [Keep all your existing authentication code...]
    
    // Modified submitOrder function
    async function submitOrder(e) {
        e.preventDefault();
        
        // Show loading overlay
        loadingOverlay.classList.remove('hidden');

        // Get form data
        const customerData = {
            name: document.getElementById('name').value,
            email: document.getElementById('email').value,
            phone: document.getElementById('phone').value,
            address: document.getElementById('address').value,
            notes: document.getElementById('notes').value,
            userId: currentUser ? currentUser.uid : null, // Add user ID if logged in
            userPhone: currentUser ? currentUser.phoneNumber : null // Add phone number if available
        };
        
        // Format order items
        const orderItems = cart.map(item => ({
            productId: item.product.id,
            productName: item.product.name,
            price: item.product.price,
            quantity: item.quantity,
            subtotal: (item.product.price * item.quantity).toFixed(2)
        }));
        
        // Calculate total
        let total = 0;
        cart.forEach(item => {
            total += item.product.price * item.quantity;
        });
        
        // Create order document
        const orderData = {
            customer: customerData,
            items: orderItems,
            total: total.toFixed(2),
            orderDate: new Date().toISOString(),
            status: 'pre-order',
            lastUpdated: firebase.firestore.FieldValue.serverTimestamp()
        };

        try {
            // Add order to Firestore
            const docRef = await db.collection('orders').add(orderData);
            
            // Hide loading overlay
            loadingOverlay.classList.add('hidden');
            
            // Show confirmation modal
            confirmationMessage.textContent = `Thank you ${customerData.name}! Your pre-order #${docRef.id} has been received.`;
            orderReference.textContent = `Order Reference: ${docRef.id}`;
            confirmationModal.classList.remove('hidden');
            
            // Reset form and cart
            orderForm.reset();
            clearCart();
            
        } catch (error) {
            console.error("Error submitting order:", error);
            loadingOverlay.classList.add('hidden');
            alert("There was an error processing your order. Please try again.");
        }
    }

    // [Keep all other existing functions...]
</script>
