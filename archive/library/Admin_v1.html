<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .order-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }
        .tab-active {
            border-bottom: 3px solid #5D5CDE;
            font-weight: 600;
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen">
    <div class="container mx-auto px-4 py-8">
        <!-- Admin Header -->
        <header class="mb-8 flex justify-between items-center">
            <h1 class="text-3xl font-bold text-primary">Admin Dashboard</h1>
            <button id="logoutBtn" class="bg-red-500 hover:bg-red-600 text-white py-2 px-4 rounded-md">
                Log Out
            </button>
        </header>

        <!-- Navigation Tabs -->
        <div class="flex border-b mb-6">
            <button id="ordersTab" class="tab-active px-4 py-2 mr-2">Orders</button>
            <button id="productsTab" class="px-4 py-2 mr-2">Products</button>
        </div>

        <!-- Orders Section -->
        <div id="ordersSection">
            <!-- View Selector -->
            <div class="flex mb-4 space-x-2">
                <button id="chronologicalView" class="bg-primary text-white px-4 py-2 rounded-md">Chronological</button>
                <button id="userView" class="bg-gray-300 hover:bg-gray-400 px-4 py-2 rounded-md">By User</button>
                <button id="productView" class="bg-gray-300 hover:bg-gray-400 px-4 py-2 rounded-md">By Product</button>
            </div>

            <!-- Search and Filters -->
            <div class="mb-6 flex flex-col md:flex-row space-y-2 md:space-y-0 md:space-x-4">
                <input type="text" id="orderSearch" placeholder="Search orders..." class="p-2 border rounded-md flex-grow">
                <select id="statusFilter" class="p-2 border rounded-md">
                    <option value="all">All Statuses</option>
                    <option value="pre-order">Pre-Order</option>
                    <option value="processing">Processing</option>
                    <option value="shipped">Shipped</option>
                    <option value="delivered">Delivered</option>
                </select>
                <input type="date" id="dateFilter" class="p-2 border rounded-md">
            </div>

            <!-- Orders Container -->
            <div id="ordersContainer" class="grid grid-cols-1 gap-4">
                <!-- Orders will be loaded here -->
            </div>
        </div>

        <!-- Products Section (Hidden by default) -->
        <div id="productsSection" class="hidden">
            <!-- Product management UI will go here -->
            <div class="mb-6 flex justify-between">
                <h2 class="text-2xl font-semibold">Product Management</h2>
                <button id="addProductBtn" class="bg-primary hover:bg-secondary text-white px-4 py-2 rounded-md">
                    Add New Product
                </button>
            </div>
            
            <div id="productsList" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                <!-- Products will be loaded here -->
            </div>
        </div>
    </div>

    <!-- Order Detail Modal -->
    <div id="orderDetailModal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center hidden z-50">
        <div class="bg-white rounded-lg p-6 max-w-4xl w-full max-h-screen overflow-y-auto">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-xl font-bold">Order Details</h3>
                <button id="closeOrderModal" class="text-gray-500 hover:text-gray-700">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                    </svg>
                </button>
            </div>
            <div id="orderDetailContent"></div>
        </div>
    </div>

    <!-- Add/Edit Product Modal -->
    <div id="productModal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center hidden z-50">
        <div class="bg-white rounded-lg p-6 max-w-2xl w-full">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-xl font-bold" id="productModalTitle">Add New Product</h3>
                <button id="closeProductModal" class="text-gray-500 hover:text-gray-700">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                    </svg>
                </button>
            </div>
            <form id="productForm" class="space-y-4">
                <input type="hidden" id="productId">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label for="productName" class="block mb-1">Product Name</label>
                        <input type="text" id="productName" required class="w-full p-2 border rounded-md">
                    </div>
                    <div>
                        <label for="productPrice" class="block mb-1">Price</label>
                        <input type="number" id="productPrice" step="0.01" required class="w-full p-2 border rounded-md">
                    </div>
                </div>
                <div>
                    <label for="productDescription" class="block mb-1">Description</label>
                    <textarea id="productDescription" rows="3" class="w-full p-2 border rounded-md"></textarea>
                </div>
                <div>
                    <label for="productImage" class="block mb-1">Image</label>
                    <input type="file" id="productImage" accept="image/*" class="w-full p-2 border rounded-md">
                    <div id="imagePreview" class="mt-2 hidden">
                        <img id="previewImage" class="h-32 object-contain">
                    </div>
                </div>
                <div class="flex justify-end space-x-2">
                    <button type="button" id="cancelProductBtn" class="bg-gray-300 hover:bg-gray-400 px-4 py-2 rounded-md">
                        Cancel
                    </button>
                    <button type="submit" id="saveProductBtn" class="bg-primary hover:bg-secondary text-white px-4 py-2 rounded-md">
                        Save Product
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // Firebase Configuration (same as your main app)
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "your-app.firebaseapp.com",
            projectId: "your-project-id",
            storageBucket: "your-app.appspot.com",
            messagingSenderId: "your-messaging-sender-id",
            appId: "your-app-id"
        };

        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth();

        // Check authentication state
        auth.onAuthStateChanged(user => {
            if (!user) {
                // Redirect to login if not authenticated
                window.location.href = 'index.html';
            } else {
                // Load orders by default
                loadOrders('chronological');
            }
        });

        // Logout functionality
        document.getElementById('logoutBtn').addEventListener('click', () => {
            auth.signOut().then(() => {
                window.location.href = 'index.html';
            });
        });

        // Tab switching
        document.getElementById('ordersTab').addEventListener('click', () => {
            document.getElementById('ordersSection').classList.remove('hidden');
            document.getElementById('productsSection').classList.add('hidden');
            document.getElementById('ordersTab').classList.add('tab-active');
            document.getElementById('productsTab').classList.remove('tab-active');
        });

        document.getElementById('productsTab').addEventListener('click', () => {
            document.getElementById('ordersSection').classList.add('hidden');
            document.getElementById('productsSection').classList.remove('hidden');
            document.getElementById('ordersTab').classList.remove('tab-active');
            document.getElementById('productsTab').classList.add('tab-active');
            loadProducts();
        });

        // View switching
        document.getElementById('chronologicalView').addEventListener('click', () => {
            loadOrders('chronological');
            updateActiveViewButton('chronologicalView');
        });

        document.getElementById('userView').addEventListener('click', () => {
            loadOrders('user');
            updateActiveViewButton('userView');
        });

        document.getElementById('productView').addEventListener('click', () => {
            loadOrders('product');
            updateActiveViewButton('productView');
        });

        function updateActiveViewButton(activeId) {
            ['chronologicalView', 'userView', 'productView'].forEach(id => {
                const btn = document.getElementById(id);
                if (id === activeId) {
                    btn.classList.add('bg-primary', 'text-white');
                    btn.classList.remove('bg-gray-300', 'hover:bg-gray-400');
                } else {
                    btn.classList.remove('bg-primary', 'text-white');
                    btn.classList.add('bg-gray-300', 'hover:bg-gray-400');
                }
            });
        }

        // [Continued in next message...]
    </script>
</body>
</html>
