<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>p5.js template</title>
  <script src="https://cdn.jsdelivr.net/npm/p5@0.10.2/lib/p5.min.js"></script>
  <style>
    html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; width: 100%; }
    canvas { display: block; }
  </style>
</head>
<body>

  <script>

    let currentUser = { userPhone: 'Guest User' };

    // Colors (Hex)
    const furColorHex = '#8B4513', shadeColorHex = '#654321', faceColorHex = '#F5F5DC';
    const patchColorHex = '#404040', blackHex = '#000000', whiteHex = '#FFFFFF';
    const brandColorHex = '#A78BFA', bgColorHex = '#5D5CDE';
    const bubbleBorderColorHex = '#9178d9', bubbleFillColorHex = '#d1c6ff', bubbleTextColorHex = '#a78bfa';

    // p5.Color objects
    let furColor, shadeColor, faceColor, patchColor, blackColor, whiteColor, brandColor, bgColor;
    let bubbleBorderColor, bubbleFillColor, bubbleTextColor;

    // --- CHANGE: Scaling Ratios and Base Sizes ---
    const baseSlothSizeRel = 1 / 70; // Base size relative to width
    const bubbleScaleRatio = 0.6;    // Bubble text pixels relative to sloth pixels
    const brandScaleRatio = 0.8;     // Brand text pixels relative to sloth pixels
    const minPixelSize = 2;          // Absolute minimum pixel size for any element

    // Dynamic Pixel Sizes (calculated)
    let slothPixelSize, bubbleTextPixelSize, brandTextPixelSize;
    let pS, pT; // Shortcuts (pS = slothPixelSize, pT will be bubbleTextPixelSize initially)

    // Layout Parameters
    const textCharWidth = 5, textCharHeight = 7;
    const bubbleCharSpacing = 1, brandCharSpacing = 2;
    const textLineSpacing = 2, bubblePadding = 6;
    const breakpointWidth = 768; // CHANGE: Define breakpoint

    // Animation State
    let slothCurrentX, slothTargetX;
    let slothDirection = 1, lastMoveTime = 0;
    const moveInterval = 1000, pauseDuration = 500;
    let canTriggerMove = true, pauseStartTime = 0;

    // Brand Text Layout
    let brandTextWidth = 0, brandTextMinX = 0, brandTextMaxX = 0, stepWidth = 0;
    let targetLetterIndex = 0;
    const brandMessage = "YUMMY BUY";
    let letterScales = [], letterColors = [];
    const highlightScaleTarget = 1.05, defaultScaleTarget = 1.0, lerpSpeed = 0.15;

    // --- CHANGE: Function to calculate dynamic pixel sizes with height constraint ---
    function calculatePixelSizes() {
        // 1. Calculate preliminary sizes based purely on width
        let widthBased_pS = max(minPixelSize, floor(width * baseSlothSizeRel));
        let prelim_pS = widthBased_pS;
        let prelim_pT = max(minPixelSize, floor(prelim_pS * bubbleScaleRatio));
        let prelim_brandP = max(minPixelSize, floor(prelim_pS * brandScaleRatio));

        // 2. Estimate drawing height with these preliminary sizes
        // Need to estimate positions (these are approximate, as exact bubble depends on text)
        let est_bounce = prelim_pS * 0.8;
        let est_slothBaseY = height * 0.55;
        let est_slothHeadCenterY = est_slothBaseY - prelim_pS * 5;
        let est_slothHeadTopY = est_slothHeadCenterY - (prelim_pS * 7 / 2);
        // Simplified bubble height estimation for scaling check (e.g., assume 3 lines)
        let est_bubbleBodyH_pixels = (3 * textCharHeight + 2 * textLineSpacing) + bubblePadding * 2;
        let est_bubbleBottomMargin = prelim_pS * 2;
        let est_bubbleTopY = est_slothHeadTopY - est_bounce - est_bubbleBottomMargin - (est_bubbleBodyH_pixels * prelim_pT);
        let est_brandTextY = est_slothBaseY + est_bounce + prelim_pS * 10;
        let est_brandTextBottomY = est_brandTextY + (textCharHeight * prelim_brandP);
        let actualDrawingHeight = est_brandTextBottomY - est_bubbleTopY;

        // 3. Determine target maximum height based on viewport height and breakpoint
        let targetMaxHeight = (width > breakpointWidth) ? height * 0.50 : height * 0.333;

        // 4. Check if height constraint is needed
        let final_pS = prelim_pS;
        if (actualDrawingHeight > targetMaxHeight && actualDrawingHeight > 0) {
            let heightScaleFactor = targetMaxHeight / actualDrawingHeight;
            // Apply scaling factor, ensuring minimum size
            final_pS = max(minPixelSize, floor(prelim_pS * heightScaleFactor));
            // console.log(`Height constrained: factor=${heightScaleFactor.toFixed(2)}, pS: ${prelim_pS} -> ${final_pS}`);
        } else {
            // console.log(`Width constrained: pS=${final_pS}`);
        }

        // 5. Set final pixel sizes based on the constrained sloth size
        slothPixelSize = final_pS;
        bubbleTextPixelSize = max(minPixelSize, floor(slothPixelSize * bubbleScaleRatio));
        brandTextPixelSize = max(minPixelSize, floor(slothPixelSize * brandScaleRatio));

        // Update shortcuts
        pS = slothPixelSize;
        pT = bubbleTextPixelSize; // pT is the *initial* bubble size for the frame
        // console.log(`Final Sizes - pS: ${pS}, pT: ${pT}, brandP: ${brandTextPixelSize}`);
    }

    function setup() {
      createCanvas(windowWidth, windowHeight);
      colorMode(RGB);
      textFont('sans-serif');
      rectMode(CENTER);
      noStroke();

      // --- Initialize p5.Color objects ---
      try {
          furColor = color(furColorHex); shadeColor = color(shadeColorHex); faceColor = color(faceColorHex);
          patchColor = color(patchColorHex); blackColor = color(blackHex); whiteColor = color(whiteHex);
          brandColor = color(brandColorHex); bgColor = color(bgColorHex);
          bubbleBorderColor = color(bubbleBorderColorHex); bubbleFillColor = color(bubbleFillColorHex); bubbleTextColor = color(bubbleTextColorHex);
      } catch (e) {
          console.error("Error initializing colors:", e); // Fallbacks...
          furColor = color(139, 69, 19); shadeColor = color(101, 67, 33); faceColor = color(245, 245, 220);
          patchColor = color(64, 64, 64); blackColor = color(0); whiteColor = color(255);
          brandColor = color(167, 139, 250); bgColor = color(93, 92, 222);
          bubbleBorderColor = color(145, 120, 217); bubbleFillColor = color(209, 198, 255); bubbleTextColor = color(167, 139, 250);
      }

      // Calculate initial pixel sizes based on window dimensions and constraints
      calculatePixelSizes();

      // Initial position centered
      slothCurrentX = width / 2;
      slothTargetX = width / 2;

      // Calculate layout AFTER colors and sizes defined
      calculateLayoutParameters();

      targetLetterIndex = findLetterIndex(slothTargetX);
      lastMoveTime = millis();
    }

    function calculateLayoutParameters() {
        if (!brandColor || !whiteColor || !brandTextPixelSize) {
            console.error("Cannot calculate layout: colors/sizes not ready."); return;
        }
        let numChars = brandMessage.length;
        letterScales = []; letterColors = [];
        let totalWidthPixels = numChars * textCharWidth + (numChars - 1) * brandCharSpacing;
        brandTextWidth = totalWidthPixels * brandTextPixelSize; // Use calculated brandTextPixelSize
        brandTextMinX = width / 2 - brandTextWidth / 2;
        brandTextMaxX = width / 2 + brandTextWidth / 2;
        stepWidth = (textCharWidth + brandCharSpacing) * brandTextPixelSize; // Use calculated brandTextPixelSize

        for (let i = 0; i < numChars; i++) {
            letterScales.push(defaultScaleTarget);
            letterColors.push(brandColor);
        }
        if (slothTargetX !== undefined) {
            slothTargetX = constrain(slothTargetX, brandTextMinX, brandTextMaxX);
        } else {
            slothTargetX = width / 2;
        }
        targetLetterIndex = stepWidth > 0 ? findLetterIndex(slothTargetX) : 0;
    }

    function findLetterIndex(xPos) {
        if (stepWidth <= 0) return 0;
        let relativePos = xPos - brandTextMinX;
        let index = round(relativePos / stepWidth);
        return constrain(index, 0, brandMessage.length - 1);
    }

    function draw() {
        if (!bgColor || !brandColor || !pS || !pT) return; // Check essential vars

        background(bgColor);
        let now = millis();

        // --- Animation Timing & State ---
        if (!canTriggerMove && now - pauseStartTime >= pauseDuration) canTriggerMove = true;
        if (canTriggerMove && now - lastMoveTime >= moveInterval) {
            lastMoveTime = now;
            let nextTargetX = slothTargetX + slothDirection * stepWidth;
            if (stepWidth > 0) { // Avoid infinite loop if stepWidth is 0
                 if (slothDirection === 1 && targetLetterIndex >= brandMessage.length - 1) {
                    slothDirection = -1; nextTargetX = slothTargetX + slothDirection * stepWidth;
                 } else if (slothDirection === -1 && targetLetterIndex <= 0) {
                     slothDirection = 1; nextTargetX = slothTargetX + slothDirection * stepWidth;
                 }
                 nextTargetX = constrain(nextTargetX, brandTextMinX, brandTextMaxX);
                 slothTargetX = nextTargetX;
                 targetLetterIndex = findLetterIndex(slothTargetX);
             }
             canTriggerMove = false;
             pauseStartTime = now;
        }

        // --- Smooth Movement & Bounce ---
        slothCurrentX = lerp(slothCurrentX, slothTargetX, 0.1);
        let bounceAmplitude = pS * 0.8;
        let bounceSpeed = 0.05;
        let bounceOffset = sin(frameCount * bounceSpeed) * bounceAmplitude;

        // --- Sloth Positioning ---
        let slothBaseY = height * 0.55;
        let slothCurrentY = slothBaseY + bounceOffset;
        let slothHeadCenterY = slothCurrentY - pS * 5;
        let slothHeadTopEdgeY = slothHeadCenterY - (pS * 7 / 2);

        // --- Draw Sloth ---
        push();
        translate(slothCurrentX, slothCurrentY);
        drawPixelSloth(pS);
        pop();

        // --- Update Brand Text Highlight ---
        for (let i = 0; i < brandMessage.length; i++) { /* ... lerping logic ... */
            if (i >= letterColors.length || i >= letterScales.length) continue;
            let isTarget = (i === targetLetterIndex);
            let targetColor = isTarget ? whiteColor : brandColor;
            let targetScale = isTarget ? highlightScaleTarget : defaultScaleTarget;
            letterScales[i] = lerp(letterScales[i], targetScale, lerpSpeed);
            if(letterColors[i]) { letterColors[i] = lerpColor(letterColors[i], targetColor, lerpSpeed); }
            else { letterColors[i] = targetColor; }
        }

        // --- Draw Brand Text ---
        let brandTextY = slothBaseY + bounceAmplitude + pS * 10;
        // Use dynamically calculated brandTextPixelSize
        drawPixelText(brandMessage, width / 2, brandTextY, brandTextPixelSize, textCharWidth, textCharHeight, brandCharSpacing, letterColors, letterScales, false);
        // CHANGE: Calculate brand text bottom edge for height check (even though check is in calculatePixelSizes)
        let brandTextBottomY = brandTextY + (textCharHeight * brandTextPixelSize);


        // --- Pixel Speech Bubble Calculations ---
        // Initial bubble text pixel size from global calculation
        let currentFrame_pT = pT;

        // Prepare message and calculate intrinsic text size
        let today = new Date().toLocaleDateString();
        let message = `HELLO, ${currentUser.userPhone}!\nTODAY IS ${today}`;
        let messageLines = message.split('\n');
        let bubbleTextHeightPixels = messageLines.length * textCharHeight + (messageLines.length - 1) * textLineSpacing;
        let longestLineWidthPixels = 0;
        for (let line of messageLines) {
            let lineWidth = line.length * textCharWidth + (line.length > 0 ? line.length - 1 : 0) * bubbleCharSpacing;
            longestLineWidthPixels = max(lineWidth, longestLineWidthPixels);
        }
        longestLineWidthPixels = max(15, longestLineWidthPixels); // Ensure min width
        let bubbleContentWidthPixels = longestLineWidthPixels; // Intrinsic text width in char pixels
        let bubbleContentHeightPixels = bubbleTextHeightPixels; // Intrinsic text height in char pixels

        // Calculate bubble body size based on intrinsic text size
        let bubbleBodyWidthPixels = bubbleContentWidthPixels + bubblePadding * 2;
        let bubbleBodyHeightPixels = bubbleContentHeightPixels + bubblePadding * 2;
        let doubledBubbleBodyWidthPixels = bubbleBodyWidthPixels * 2; // Double the width

        // --- CHANGE: Bubble Text Constraints ---
        // Calculate max content area in screen pixels based on the *doubled* bubble width
        let bubbleInnerWidthScreenPx = (doubledBubbleBodyWidthPixels - bubblePadding * 2) * currentFrame_pT; // Width available inside padding
        let bubbleInnerHeightScreenPx = (bubbleBodyHeightPixels - bubblePadding * 2) * currentFrame_pT; // Height available inside padding
        let maxTextContentWidth = bubbleInnerWidthScreenPx * 0.90;
        let maxTextContentHeight = bubbleInnerHeightScreenPx * 0.95;

        // Calculate max allowed pT based on constraints
        let maxWidth_pT = (bubbleContentWidthPixels > 0) ? floor(maxTextContentWidth / bubbleContentWidthPixels) : currentFrame_pT;
        let maxHeight_pT = (bubbleContentHeightPixels > 0) ? floor(maxTextContentHeight / bubbleContentHeightPixels) : currentFrame_pT;

        // Determine the final pixel size for the bubble text for this frame
        let finalBubble_pT = max(1, floor(min(currentFrame_pT, maxWidth_pT, maxHeight_pT)));
        // --- End Bubble Text Constraints ---


        // --- Bubble Positioning ---
        let bubbleBottomMargin = pS * 2;
        let bubbleBottomY = slothHeadTopEdgeY - bounceAmplitude - bubbleBottomMargin;
        // Use finalBubble_pT for correct vertical positioning based on potentially smaller text
        let bubbleTotalHeightScreenPx = bubbleBodyHeightPixels * finalBubble_pT;
        let bubbleTopY = bubbleBottomY - bubbleTotalHeightScreenPx;
        let bubbleCenterX = slothCurrentX + pS * 1;

        // Draw the bubble body and tail (use finalBubble_pT for rendering bubble elements)
        let tailTargetY = slothHeadTopEdgeY + pS * 2;
        drawPixelBubble(bubbleCenterX, bubbleTopY, doubledBubbleBodyWidthPixels, bubbleBodyHeightPixels, finalBubble_pT, slothCurrentX, tailTargetY, bubbleFillColor, bubbleBorderColor);

        // --- CHANGE: Bubble Text Centering ---
        // Calculate bubble's visual center coordinates
        let bubbleTotalWidthScreenPx = doubledBubbleBodyWidthPixels * finalBubble_pT;
        let bubbleVisualCenterX = bubbleCenterX; // Already calculated for the center
        let bubbleVisualCenterY = bubbleTopY + bubbleTotalHeightScreenPx / 2;

        // Calculate the text block's render dimensions using finalBubble_pT
        let textBlockRenderWidth = bubbleContentWidthPixels * finalBubble_pT;
        let textBlockRenderHeight = bubbleContentHeightPixels * finalBubble_pT;

        // Calculate top-left start position to center the text block
        let textStartX = bubbleVisualCenterX - textBlockRenderWidth / 2;
        let textStartY = bubbleVisualCenterY - textBlockRenderHeight / 2;
        // --- End Bubble Text Centering ---

        // Prepare text colors/scales
        let bubbleDefaultColors = []; let bubbleDefaultScales = [];
        let drawableCharCount = message.replace('\n', '').length; // Count non-newline chars
        for(let i = 0; i < drawableCharCount; i++) {
            bubbleDefaultColors.push(bubbleTextColor);
            bubbleDefaultScales.push(1.0);
        }

        // Draw the text inside the bubble using finalBubble_pT and calculated centered position
        drawPixelText(message, textStartX, textStartY, finalBubble_pT, textCharWidth, textCharHeight, bubbleCharSpacing, bubbleDefaultColors, bubbleDefaultScales, true); // alignLeft=true is handled by startX calc

        // CHANGE: Calculate bubble top edge for height check (even though check is in calculatePixelSizes)
        // let actualBubbleTopY = bubbleTopY;
        // console.log(`Draw H: ${brandTextBottomY - actualBubbleTopY} (${height}vh)`);

        rectMode(CENTER); noStroke();
    }

    // --- Drawing Functions (drawPixelSloth, drawPixelBubble, drawPixelText, drawPixelChar) ---
    // These functions remain largely the same, just ensure they correctly use the
    // pixel size 'p' passed to them.

    function drawPixelSloth(p) { /* ... unchanged Sloth drawing code ... */
        rectMode(CENTER); noStroke();
        fill(furColor); rect(0, p * 2, p * 10, p * 12); fill(faceColor); rect(0, p * 2, p * 6, p * 8); fill(shadeColor); rect(p * 4, p * 2, p * 2, p * 12); rect(-p * 4, p * 2, p * 2, p * 12); rect(0, p * 7, p * 10, p * 2);
        let headY = -p * 5; fill(furColor); rect(0, headY, p * 9, p * 7); fill(faceColor); rect(0, headY, p * 7, p * 5); fill(patchColor); rect(-p * 2.5, headY, p * 3, p * 4); rect(p * 2.5, headY, p * 3, p * 4); fill(blackColor); rect(-p * 2.5, headY, p, p); rect(p * 2.5, headY, p, p); fill(blackColor); rect(0, headY + p * 2, p * 3, p);
        let armY = -p * 1; let armW = p * 3; let armH = p * 9; let armOffsetX = p * 6.5; fill(furColor); rect(-armOffsetX, armY, armW, armH); fill(shadeColor); rect(-armOffsetX + p , armY, p, armH); fill(blackColor); let clawBaseYL = armY + armH / 2; rect(-armOffsetX - p * 0.5, clawBaseYL + p * 0.5, p, p*2); rect(-armOffsetX + p * 0.5, clawBaseYL + p * 1.5, p, p*2); rect(-armOffsetX + p * 1.5, clawBaseYL + p * 0.5, p, p*2); fill(furColor); rect(armOffsetX, armY, armW, armH); fill(shadeColor); rect(armOffsetX - p , armY, p, armH); fill(blackColor); let clawBaseYR = armY + armH / 2; rect(armOffsetX + p * 0.5, clawBaseYR + p * 0.5, p, p*2); rect(armOffsetX - p * 0.5, clawBaseYR + p * 1.5, p, p*2); rect(armOffsetX - p * 1.5, clawBaseYR + p * 0.5, p, p*2);
        let legY = p * 8.5; let legW = p * 4; let legH = p * 5; let legOffsetX = p * 2.5; fill(furColor); rect(-legOffsetX, legY, legW, legH); fill(shadeColor); rect(-legOffsetX + p*1.5, legY, p, legH); fill(blackColor); rect(-legOffsetX - p * 1, legY + p * 2, p*3, p); rect(-legOffsetX - p * 1, legY + p * 2.5, p, p*2); rect(-legOffsetX + p * 0, legY + p * 2.5, p, p*2); rect(-legOffsetX + p * 1, legY + p * 2.5, p, p*2); fill(furColor); rect(legOffsetX, legY, legW, legH); fill(shadeColor); rect(legOffsetX - p*1.5, legY, p, legH); fill(blackColor); rect(legOffsetX + p * 1, legY + p * 2, p*3, p); rect(legOffsetX + p * 1, legY + p * 2.5, p, p*2); rect(legOffsetX + p * 0, legY + p * 2.5, p, p*2); rect(legOffsetX - p * 1, legY + p * 2.5, p, p*2);
        rectMode(CENTER);
     }

    function drawPixelBubble(centerX, topY, widthPixels, heightPixels, p, targetX, targetY, bubbleFill, bubbleBorder) { /* ... unchanged Bubble border/fill drawing ... */
        push();
        rectMode(CORNER); noStroke();
        let bubbleLeftX = centerX - (widthPixels / 2) * p;
        let bubbleBottomY = topY + heightPixels * p;
        let borderThicknessP = 2 * p;

        fill(bubbleBorder);
        rect(bubbleLeftX - p, topY - p, widthPixels * p + 2*p, heightPixels * p + 2*p);
        rect(bubbleLeftX, topY - 2*p, widthPixels * p, heightPixels * p + 4*p);

        fill(bubbleFill);
        rect(bubbleLeftX + p, topY + p, (widthPixels - 2) * p, (heightPixels - 2) * p);

        let tailStartX = centerX; let tailStartY = bubbleBottomY; let steps = 4;

        fill(bubbleBorder);
        for (let i = 1; i <= steps; i++) {
            let intermediateX = lerp(tailStartX, targetX, i / (steps + 1)); let intermediateY = lerp(tailStartY, targetY, i / (steps + 1));
            let gridX = floor(intermediateX / p) * p; let gridY = floor(intermediateY / p) * p;
            rect(gridX - p * 1.5, gridY - p * 1.5, p * 4, p * 4);
        }
        fill(bubbleFill);
        for (let i = 1; i <= steps; i++) {
            let intermediateX = lerp(tailStartX, targetX, i / (steps + 1.5)); let intermediateY = lerp(tailStartY, targetY, i / (steps + 1.5));
            let gridX = floor(intermediateX / p) * p; let gridY = floor(intermediateY / p) * p;
            rect(gridX - p/2, gridY - p/2, p*2, p*2);
        }
        pop();
        rectMode(CENTER);
    }

    function drawPixelText(message, startX, startY, p, charW, charH, spacingP, colors, scales, alignLeft = false) { /* ... unchanged Text drawing logic ... */
        // Note: alignLeft flag is effectively ignored when centering logic calculates startX/startY
        // but the internal drawing per line still uses startX as the left edge.
        let currentX = startX;
        let currentY = startY;
        let lines = message.split('\n');
        let charIndex = 0;

        push();
        noStroke();
        rectMode(CORNER);

        for (let lineIndex = 0; lineIndex < lines.length; lineIndex++) {
            let line = lines[lineIndex];
            let lineRenderWidthPixels = line.length * charW + (line.length > 0 ? line.length - 1 : 0) * spacingP;
            let lineRenderWidth = lineRenderWidthPixels * p;

            // For centering, startX is pre-calculated for the whole block.
            // For individual line alignment (if needed), this would change.
            // Here, we set the starting X for *this specific line* based on the block's startX.
             currentX = startX; // Start drawing the line at the calculated block start X

            // Adjust Y position for the current line
            currentY = startY + lineIndex * (charH + textLineSpacing) * p;

            for (let i = 0; i < line.length; i++) {
                let char = line[i].toUpperCase();
                let charColor = (colors && charIndex < colors.length) ? colors[charIndex] : blackColor;
                let charScale = (scales && charIndex < scales.length) ? scales[charIndex] : 1.0;
                if (!charColor) charColor = blackColor;

                let charCenterX = charW * p / 2;
                let charCenterY = charH * p / 2;

                push();
                translate(currentX, currentY); // Translate to the top-left corner for this char
                translate(charCenterX, charCenterY);
                scale(charScale);
                translate(-charCenterX, -charCenterY);
                fill(charColor);
                drawPixelChar(char, p, charW, charH);
                pop();

                currentX += (charW + spacingP) * p; // Move to the next character position
                charIndex++;
            }
        }
        pop();
        rectMode(CENTER);
    }

    function drawPixelChar(char, p, cW, cH) { /* ... unchanged Character drawing map ... */
        const px = (x, y) => rect(x * p, y * p, p, p);
            switch (char) {
            case 'A': px(2, 0); for(let i=0; i<3; i++) px(1+i, 1); for(let y=2; y<cH; y++) { px(0, y); px(4, y); } px(1, 3); px(2, 3); px(3, 3); break;
            case 'B': for(let y=0; y<cH; y++) px(0, y); px(1, 0); px(2, 0); px(3, 0); px(4, 1); px(1, 3); px(2, 3); px(3, 3); px(4, 2); px(4, 4); px(1, cH-1); px(2, cH-1); px(3, cH-1); px(4, cH-2); break;
            case 'C': for(let y=1; y<cH-1; y++) px(0, y); px(1, 0); px(2, 0); px(3, 0); px(4, 1); px(1, cH-1); px(2, cH-1); px(3, cH-1); px(4, cH-2); break;
            case 'D': for(let y=0; y<cH; y++) px(0, y); px(1, 0); px(2, 0); px(3, 0); px(4, 1); px(4, cH-2); px(1, cH-1); px(2, cH-1); px(3, cH-1); for(let y=2; y<cH-2; y++) px(4,y); break;
            case 'E': for(let y=0; y<cH; y++) px(0, y); for(let x=1; x<cW; x++) { px(x, 0); px(x, cH-1); px(x, floor(cH/2));} break;
            case 'G': for(let y=1; y<cH-1; y++) px(0, y); px(1, 0); px(2, 0); px(3, 0); px(4, 1); px(1, cH-1); px(2, cH-1); px(3, cH-1); px(4, cH-2); for(let x=2; x<cW-1; x++) px(x, floor(cH/2)); px(4, floor(cH/2)); break;
            case 'H': for(let y=0; y<cH; y++) { px(0, y); px(4, y); } for(let x=1; x<cW-1; x++) px(x, floor(cH/2)); break;
            case 'I': for(let x=0; x<cW; x++) { px(x, 0); px(x, cH-1); } for(let y=1; y<cH-1; y++) px(2, y); break;
            case 'L': for(let y=0; y<cH; y++) px(0, y); for(let x=1; x<cW; x++) px(x, cH-1); break;
            case 'M': for(let y=0; y<cH; y++) { px(0, y); px(4, y); } px(1, 1); px(3, 1); px(2, 2); break;
            case 'N': for(let y=0; y<cH; y++) { px(0, y); px(4, y); } px(1, 1); px(1, 2); px(2, 3); px(3, 4); px(3, 5); break; // Diagonal approx
            case 'O': for(let y=1; y<cH-1; y++) { px(0, y); px(4, y); } for(let x=1; x<cW-1; x++) { px(x, 0); px(x, cH-1); } break;
            case 'P': for(let y=0; y<cH; y++) px(0,y); for(let x=1; x<cW-1; x++) {px(x,0); px(x, floor(cH/2));} px(4,1); px(4,2); break; // Added P
            case 'R': for(let y=0; y<cH; y++) px(0, y); px(1, 0); px(2, 0); px(3, 0); px(4, 1); px(1, 3); px(2, 3); px(3, 3); px(4, 2); px(3, 4); px(4, 5); px(4, 6); break; // Added R
            case 'S': for(let x=1; x<cW-1; x++) { px(x, 0); px(x, cH-1); px(x, floor(cH/2)); } px(0, 1); px(0, 2); px(4, cH-3); px(4, cH-2); px(4, 0); px(0, cH-1); break; // Adjusted S
            case 'T': for(let x=0; x<cW; x++) px(x, 0); for(let y=1; y<cH; y++) px(2, y); break;
            case 'U': for(let y=0; y<cH-1; y++) { px(0, y); px(4, y); } for(let x=1; x<cW-1; x++) px(x, cH-1); break;
            case 'W': for(let y=0; y<cH; y++) { px(0, y); px(4, y); } px(1, cH-2); px(2, cH-3); px(3, cH-2); break;
            case 'Y': px(0, 0); px(4, 0); px(1, 1); px(3, 1); px(2, 2); for(let y=3; y<cH; y++) px(2, y); break;
            case '!': for(let y=0; y<cH-2; y++) px(2,y); px(2, cH-1); break;
            case ',': px(2, cH-1); px(1, cH-1); px(1, cH-2); break; // Simplified comma
            case '.': px(2, cH-1); break;
            case '-': for(let x=1; x<cW-1; x++) px(x, floor(cH/2)); break; // Dash
            case '/': px(4, 0); px(4, 1); px(3, 2); px(2, 3); px(1, 4); px(0, 5); px(0, 6); break; // Forward slash approx
            case '0': for(let y=1; y<cH-1; y++) { px(0, y); px(4, y); } for(let x=1; x<cW-1; x++) { px(x, 0); px(x, cH-1); } px(3, 1); px(2,2); px(1,3); px(1,4); break; // 0 with slash
            case '1': for (let x=1; x<cW-1; x++) px(x,cH-1); for (let y=0; y<cH; y++) px(2,y); px(1,1); break;
            case '2': for(let x=0; x<cW; x++) px(x, 0); px(4, 1); px(4, 2); for(let x=0; x<cW; x++) px(x, floor(cH/2)); px(0, floor(cH/2)+1); px(0, cH-2); for(let x=0; x<cW; x++) px(x, cH-1); break;
            case '3': for(let x=0; x<cW-1; x++) { px(x,0); px(x, cH-1); } for(let x=1; x<cW-1; x++) px(x, floor(cH/2)); for(let y=1; y<cH-1; y++) px(4,y); break;
            case '4': for(let y=0; y<floor(cH/2)+1; y++) px(0,y); for(let y=0; y<cH; y++) px(4,y); for(let x=1; x<cW-1; x++) px(x, floor(cH/2)); break;
            case '5': for(let x=0; x<cW; x++) px(x,0); px(0,1); px(0,2); px(1,3); px(2,3); px(3,3); px(4,4); px(4,5); px(3,6); px(2,6); px(1,6); break; // Complex 5
            case '6': for(let x=1; x<cW; x++) px(x,0); for(let y=1; y<cH; y++) px(0,y); for(let y=floor(cH/2)+1; y<cH-1; y++) px(4,y); for(let x=1; x<cW-1; x++) { px(x, floor(cH/2)); px(x, cH-1); } break;
            case '7': for(let x=0; x<cW; x++) px(x,0); px(4,1); px(4,2); px(3,3); px(2,4); px(2,5); px(2,6); break;
            case '8': for(let x=1; x<cW-1; x++) { px(x,0); px(x,cH-1); px(x,floor(cH/2)); } for(let y=1; y<cH-1; y++) { px(0,y); px(4,y); } break;
            case '9': for(let x=0; x<cW-1; x++) px(x,cH-1); for(let y=0; y<cH; y++) px(4,y); for(let y=1; y<floor(cH/2); y++) px(0,y); for(let x=1; x<cW-1; x++) { px(x,0); px(x, floor(cH/2)); } break;
            case ' ': break; // Space
            default: px(0, 0); px(cW - 1, 0); px(0, cH - 1); px(cW - 1, cH - 1); break; // Unknown char placeholder
        }
    }


    // Responsive Canvas
    function windowResized() {
      resizeCanvas(windowWidth, windowHeight);
      // Recalculate sizes based on new dimensions and constraints
      calculatePixelSizes();
      // Recalculate layout based on new sizes
      if (brandColor) {
          calculateLayoutParameters();
      }
      // Reset sloth position and state
      slothCurrentX = width / 2;
      slothTargetX = width / 2;
      targetLetterIndex = stepWidth > 0 ? findLetterIndex(slothTargetX) : 0;
      canTriggerMove = true;
      lastMoveTime = millis();
      pauseStartTime = 0;
    }

    // --- Click/Tap Interaction ---
    function handleInteraction(px, py) { /* ... unchanged interaction logic ... */
        if (!pS || !slothCurrentX || !slothCurrentY) return; // Check required vars
        let slothDrawWidth = 16 * pS;
        let slothTopOffset = -8.5 * pS;
        let slothBottomOffset = 11 * pS;
        let slothLeft = slothCurrentX - slothDrawWidth / 2;
        let slothRight = slothCurrentX + slothDrawWidth / 2;
        let slothTop = slothCurrentY + slothTopOffset;
        let slothBottom = slothCurrentY + slothBottomOffset;

        if (px > slothLeft && px < slothRight && py > slothTop && py < slothBottom) {
            console.log("Sloth clicked!");
            window.location.href = '/products.html';
        }
     }
    function mousePressed() { handleInteraction(mouseX, mouseY); return false; }
    function touchStarted() { if (touches.length > 0) { handleInteraction(touches[0].x, touches[0].y); } return false; }
