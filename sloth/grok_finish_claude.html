<!DOCTYPE html>
<!-- Grok's finishing of Claude's unfinished 1st version rehaul -->
<html>
<head>
    <title>Yummy Buy Sloth Animation</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.2/p5.min.js"></script>
</head>
<body>
<script>
let currentUser = { userPhone: 'Guest User' };
// Color definitions
const furColorHex = '#8B4513', shadeColorHex = '#654321', faceColorHex = '#F5F5DC';
const patchColorHex = '#404040', blackHex = '#000000', whiteHex = '#FFFFFF';
const brandColorHex = '#A78BFA', bgColorHex = '#5D5CDE';
const bubbleBorderColorHex = '#9178d9', bubbleFillColorHex = '#d1c6ff', bubbleTextColorHex = '#a78bfa';
let furColor, shadeColor, faceColor, patchColor, blackColor, whiteColor, brandColor, bgColor;
let bubbleBorderColor, bubbleFillColor, bubbleTextColor;

// Sizing constants
const baseSlothSizeRel = 1 / 75;
const baseBubbleSizeRel = 1 / 220;
const minPixelSize = 1;
const breakpointWidth = 768;
const baseBrandSizeRelAbove = 1 / 100;
const baseBrandSizeRelBelow = 1 / 70;

// Scaling factors
const bubbleScaleFactorMin = 1.0;
const bubbleScaleFactorMax = 1.5;
const mobileHeightScaleFactor = 0.333;
const desktopHeightScaleFactor = 0.50;

// Text parameters
let slothPixelSize, bubbleTextPixelSize, brandTextPixelSize;
let pS, pT;
const textCharWidth = 5, textCharHeight = 7;
const bubbleCharSpacing = 1, brandCharSpacing = 2;
const textLineSpacing = 2;
const bubbleVerticalPadding = 6;

// Sloth movement variables
let slothCurrentX;
let slothCurrentY;
let slothTargetX;
let slothDirection = 1, lastMoveTime = 0;
const moveInterval = 1000, pauseDuration = 500;
let canTriggerMove = true, pauseStartTime = 0;

// Brand text variables
let brandTextWidth = 0, brandTextMinX = 0, brandTextMaxX = 0, stepWidth = 0;
let targetLetterIndex = 0;
const brandMessage = "YUMMY BUY";
let letterScales = [], letterColors = [];
const highlightScaleTarget = 1.05, defaultScaleTarget = 1.0, lerpSpeed = 0.15;

// Confetti variables
let confettiParticles = [];
let confettiActive = false;
let navigationTimer = null;
const confettiCount = 150;
const navigationDelay = 1200;

// Get the bubble scale factor with smoother interpolation
function getBubbleScaleFactor() {
    if (width <= breakpointWidth) {
        // Linear interpolation between min and max based on width
        let t = (width - 320) / (breakpointWidth - 320); // Normalize between 320px and 768px
        t = constrain(t, 0, 1);
        return lerp(bubbleScaleFactorMax, bubbleScaleFactorMin, t);
    }
    return bubbleScaleFactorMin;
}

// Get the height scale factor based on viewport width
function getHeightScaleFactor() {
    return (width > breakpointWidth) ? desktopHeightScaleFactor : mobileHeightScaleFactor;
}

// Calculate pixel sizes for responsive elements
function calculatePixelSizes() {
    // Base pixel sizes
    let prelim_pS = max(minPixelSize, floor(width * baseSlothSizeRel));
    let prelim_pT = max(minPixelSize, floor(width * baseBubbleSizeRel));
    let currentBaseBrandSizeRel = (width > breakpointWidth) ? baseBrandSizeRelAbove : baseBrandSizeRelBelow;
    let prelim_brandP = max(minPixelSize, floor(width * currentBaseBrandSizeRel));

    // Estimate heights for scaling
    let bubbleScaleFactor = getBubbleScaleFactor();
    let estBubbleTextH_pixels = 2 * textCharHeight + (2 - 1) * textLineSpacing;
    let estBubbleBodyH_pixels = estBubbleTextH_pixels + bubbleVerticalPadding * 2;
    let estVisualTextBlockHeight = estBubbleBodyH_pixels * prelim_pT * bubbleScaleFactor;

    // Sloth and text positions
    let est_bounce = prelim_pS * 0.8;
    let est_slothBaseY = height * 0.55;
    let est_slothHeadCenterY = est_slothBaseY - prelim_pS * 5;
    let est_slothHeadTopY = est_slothHeadCenterY - (prelim_pS * 7 / 2);
    let est_bubbleBottomMargin = prelim_pS * 2;
    let est_verticalShift = (prelim_pS * 7) / 3;
    let est_adjustedHeadTopY = est_slothHeadTopY - est_verticalShift;
    let est_textBlockTopY = est_adjustedHeadTopY - est_bounce - est_bubbleBottomMargin - estVisualTextBlockHeight;
    let est_brandTextY = est_slothBaseY + est_bounce + prelim_pS * 10;
    let est_brandTextBottomY = est_brandTextY + (textCharHeight * prelim_brandP);

    // Apply height scaling
    let estimatedDrawingHeight = est_brandTextBottomY - est_textBlockTopY;
    let targetMaxHeight = height * getHeightScaleFactor();
    let heightScaleFactor = min(1.0, targetMaxHeight / max(estimatedDrawingHeight, 1));

    // Final pixel sizes with bounds
    slothPixelSize = max(minPixelSize, floor(prelim_pS * heightScaleFactor));
    bubbleTextPixelSize = max(minPixelSize, floor(prelim_pT * heightScaleFactor));
    brandTextPixelSize = max(minPixelSize, floor(prelim_brandP * heightScaleFactor));
    pS = slothPixelSize;
    pT = bubbleTextPixelSize;
}

// Particle class for confetti effect
class Particle {
    constructor(x, y) {
        this.pos = createVector(x, y);
        this.vel = p5.Vector.random2D().mult(random(1.5, 5));
        this.acc = createVector(0, 0.08);
        this.colorHue = random(360);
        this.colorSat = 90;
        this.colorBri = 90;
        this.lifespan = random(120, 200);
        this.age = 0;
        this.initialSize = random(3, 8);
        this.angle = random(TWO_PI);
        this.rotSpeed = random(-0.08, 0.08);
    }

    update() {
        this.vel.add(this.acc);
        this.vel.mult(0.98);
        this.pos.add(this.vel);
        this.angle += this.rotSpeed;
        this.age++;
    }

    display() {
        let alpha = map(this.age, 0, this.lifespan, 1, 0);
        alpha = constrain(alpha, 0, 1);
        push();
        translate(this.pos.x, this.pos.y);
        rotate(this.angle);
        noStroke();
        fill(this.colorHue, this.colorSat, this.colorBri, alpha);
        rectMode(CENTER);
        rect(0, 0, this.initialSize * alpha, this.initialSize * alpha * 1.5);
        pop();
    }

    isDead() {
        return this.age >= this.lifespan;
    }
}

function setup() {
    createCanvas(windowWidth, windowHeight);
    colorMode(HSB, 360, 100, 100, 1);
    textFont('sans-serif');
    rectMode(CENTER);
    noStroke();

    // Initialize colors
    try {
        furColor = color(furColorHex);
        shadeColor = color(shadeColorHex);
        faceColor = color(faceColorHex);
        patchColor = color(patchColorHex);
        blackColor = color(blackHex);
        whiteColor = color(whiteHex);
        brandColor = color(brandColorHex);
        bgColor = color(bgColorHex);
        bubbleBorderColor = color(bubbleBorderColorHex);
        bubbleFillColor = color(bubbleFillColorHex);
        bubbleTextColor = color(bubbleTextColorHex);
    } catch (e) {
        console.error("Error initializing colors:", e);
        furColor = color(30, 70, 54);
        shadeColor = color(29, 67, 40);
        faceColor = color(60, 10, 96);
        patchColor = color(0, 0, 25);
        blackColor = color(0, 0, 0);
        whiteColor = color(0, 0, 100);
        brandColor = color(258, 44, 98);
        bgColor = color(241, 59, 87);
        bubbleBorderColor = color(257, 43, 85);
        bubbleFillColor = color(250, 18, 100);
        bubbleTextColor = color(258, 44, 98);
    }

    // Initialize sizes and positions
    calculatePixelSizes();
    slothCurrentX = width / 2;
    slothTargetX = width / 2;
    calculateLayoutParameters();
    targetLetterIndex = findLetterIndex(slothTargetX);
    lastMoveTime = millis();

    // Initialize welcome message
    updateMessage();
    setInterval(updateMessage, 1000);
}

function calculateLayoutParameters() {
    if (!brandColor || !whiteColor || !brandTextPixelSize) return;

    let numChars = brandMessage.length;
    letterScales = [];
    letterColors = [];

    let totalWidthPixels = numChars * textCharWidth + (numChars - 1) * brandCharSpacing;
    brandTextWidth = totalWidthPixels * brandTextPixelSize;
    brandTextMinX = width / 2 - brandTextWidth / 2;
    brandTextMaxX = width / 2 + brandTextWidth / 2;
    stepWidth = (textCharWidth + brandCharSpacing) * brandTextPixelSize;

    for (let i = 0; i < numChars; i++) {
        letterScales.push(defaultScaleTarget);
        letterColors.push(brandColor);
    }

    slothTargetX = constrain(slothTargetX || width / 2, brandTextMinX, brandTextMaxX);
    targetLetterIndex = stepWidth > 0 ? findLetterIndex(slothTargetX) : 0;
}

function findLetterIndex(xPos) {
    if (stepWidth <= 0) return 0;
    let relativePos = xPos - brandTextMinX;
    let index = round(relativePos / stepWidth);
    return constrain(index, 0, brandMessage.length - 1);
}

let message;
function updateMessage() {
    const now = new Date();
    const dateOpts = { weekday: 'long', month: 'long', day: 'numeric' };
    const dateStr = now
        .toLocaleDateString('en-US', dateOpts)
        .toUpperCase()
        .replace(',', '');
    let hours = now.getHours();
    const minutes = now.getMinutes();
    const seconds = now.getSeconds();
    const ampm = hours >= 12 ? 'PM' : 'AM';
    hours = hours % 12 || 12;
    const timeStr = `${hours}:${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
    message = `Welcome To:\n------------------\nThe MIRANDA MARKET\n------------------\n${dateStr}\n${timeStr} ${ampm}`;
}

function draw() {
    if (!bgColor || !brandColor || !pS || !pT) return;
    background(bgColor);

    // Handle sloth movement
    let now = millis();
    if (!canTriggerMove && now - pauseStartTime >= pauseDuration) {
        canTriggerMove = true;
    }

    if (canTriggerMove && now - lastMoveTime >= moveInterval) {
        lastMoveTime = now;
        let nextTargetX = slothTargetX + slothDirection * stepWidth;

        if (stepWidth > 0) {
            if (slothDirection === 1 && targetLetterIndex >= brandMessage.length - 1) {
                slothDirection = -1;
            } else if (slothDirection === -1 && targetLetterIndex <= 0) {
                slothDirection = 1;
            }
            nextTargetX = slothTargetX + slothDirection * stepWidth;
        }

        slothTargetX = constrain(nextTargetX, brandTextMinX, brandTextMaxX);
        targetLetterIndex = findLetterIndex(slothTargetX);
        canTriggerMove = false;
        pauseStartTime = now;
    }

    // Smooth sloth movement
    slothCurrentX = lerp(slothCurrentX, slothTargetX, 0.1);

    // Bounce effect
    let bounceAmplitude = pS * 0.8;
    let bounceSpeed = 0.05;
    let bounceOffset = sin(frameCount * bounceSpeed) * bounceAmplitude;

    // Position sloth
    let slothBaseY = height * 0.55;
    slothCurrentY = slothBaseY + bounceOffset;
    let slothHeadCenterY = slothCurrentY - pS * 5;
    let slothHeadTopEdgeY = slothHeadCenterY - (pS * 7 / 2);

    // Draw sloth
    push();
    translate(slothCurrentX, slothCurrentY);
    drawPixelSloth(pS);
    pop();

    // Update brand text
    for (let i = 0; i < brandMessage.length; i++) {
        let isTarget = (i === targetLetterIndex);
        let targetColor = isTarget ? whiteColor : brandColor;
        let targetScale = isTarget ? highlightScaleTarget : defaultScaleTarget;
        letterScales[i] = lerp(letterScales[i], targetScale, lerpSpeed);
        letterColors[i] = lerpColor(letterColors[i] || brandColor, targetColor, lerpSpeed);
    }

    // Draw brand text
    let brandTextY = slothBaseY + bounceAmplitude + pS * 10;
    drawPixelText(
        brandMessage,
        width / 2,
        brandTextY,
        brandTextPixelSize,
        textCharWidth,
        textCharHeight,
        brandCharSpacing,
        letterColors,
        letterScales,
        false
    );

    // Calculate speech bubble
    let messageLines = message.split('\n');
    let bubbleContentHeightPixels = messageLines.length * textCharHeight + (messageLines.length - 1) * textLineSpacing;
    let longestLineWidthPixels = messageLines.reduce((max, line) => {
        let lineWidth = line.length * textCharWidth + (line.length > 0 ? line.length - 1 : 0) * bubbleCharSpacing;
        return Math.max(lineWidth, max);
    }, 15);
    let bubbleContentWidthPixels = longestLineWidthPixels;

    // Bubble position
    let finalBubbleScale = getBubbleScaleFactor();
    let verticalShift = (pS * 7) / 3;
    let bubbleBottomMargin = pS * 2;
    let adjustedHeadTopY = slothHeadTopEdgeY - verticalShift;
    let conceptualBubbleBodyHeightPixels = bubbleContentHeightPixels + 2 * bubbleVerticalPadding;
    let conceptualBubbleBottomY = adjustedHeadTopY - bounceAmplitude - bubbleBottomMargin;
    let conceptualBubbleTopY = conceptualBubbleBottomY - (conceptualBubbleBodyHeightPixels * pT);

    // Text block
    let textBlockHeightUnscaled = bubbleContentHeightPixels * pT;
    let textBlockWidthUnscaled = bubbleContentWidthPixels * pT;
    let textBlockHeightScaled = textBlockHeightUnscaled * finalBubbleScale;
    let textBlockWidthScaled = textBlockWidthUnscaled * finalBubbleScale;
    let textBlockCenterX = slothCurrentX;
    let textStartX = textBlockCenterX - (textBlockWidthScaled / 2);
    let verticalPaddingTotal = (conceptualBubbleBodyHeightPixels * pT) - textBlockHeightUnscaled;
    let textStartY = conceptualBubbleTopY + (verticalPaddingTotal * finalBubbleScale) / 2;

    // Draw bubble background
    push();
    translate(textBlockCenterX, textStartY + textBlockHeightScaled / 2);
    scale(finalBubbleScale);
    rectMode(CORNER);
    noStroke();
    fill(bubbleBorderColor);
    rect(
        -textBlockWidthUnscaled / 2 - pT,
        -textBlockHeightUnscaled / 2 - pT,
        textBlockWidthUnscaled + 2 * pT,
        textBlockHeightUnscaled + 2 * pT
    );
    fill(bubbleFillColor);
    rect(
        -textBlockWidthUnscaled / 2,
        -textBlockHeightUnscaled / 2,
        textBlockWidthUnscaled,
        textBlockHeightUnscaled
    );
    pop();

    // Draw bubble text
    let bubbleDefaultColors = Array(message.replace(/\n/g, '').length).fill(bubbleTextColor);
    let bubbleDefaultScales = Array(message.replace(/\n/g, '').length).fill(1.0);
    push();
    translate(textBlockCenterX, textStartY + textBlockHeightScaled / 2);
    scale(finalBubbleScale);
    translate(
        -textBlockCenterX / finalBubbleScale,
        -(textStartY + textBlockHeightScaled / 2) / finalBubbleScale
    );
    drawPixelText(
        message,
        textBlockCenterX - textBlockWidthUnscaled / 2,
        textStartY,
        pT,
        textCharWidth,
        textCharHeight,
        bubbleCharSpacing,
        bubbleDefaultColors,
        bubbleDefaultScales,
        true
    );
    pop();

    // Draw bubble tail
    let tail_pT = max(1, floor(pT * 0.5));
    let tailStartX = textStartX + textBlockWidthUnscaled / 2;
    let tailStartY = textStartY + textBlockHeightUnscaled;
    let tailTargetX = slothCurrentX;
    let tailTargetY = adjustedHeadTopY + pS * 2;

    push();
    translate(tailStartX, tailStartY);
    scale(finalBubbleScale);
    translate(-tailStartX, -tailStartY);
    rectMode(CORNER);
    noStroke();
    let steps = 4;
    fill(bubbleBorderColor);
    for (let i = 1; i <= steps; i++) {
        let intermediateX = lerp(tailStartX, tailTargetX, i / (steps + 1));
        let intermediateY = lerp(tailStartY, tailTargetY, i / (steps + 1));
        let gridX = floor(intermediateX / tail_pT) * tail_pT;
        let gridY = floor(intermediateY / tail_pT) * tail_pT;
        rect(gridX - tail_pT * 1.5, gridY - tail_pT * 1.5, tail_pT * 4, tail_pT * 4);
    }
    fill(bubbleFillColor);
    for (let i = 1; i <= steps; i++) {
        let intermediateX = lerp(tailStartX, tailTargetX, i / (steps + 1.5));
        let intermediateY = lerp(tailStartY, tailTargetY, i / (steps + 1.5));
        let gridX = floor(intermediateX / tail_pT) * tail_pT;
        let gridY = floor(intermediateY / tail_pT) * tail_pT;
        rect(gridX - tail_pT / 2, gridY - tail_pT / 2, tail_pT * 2, tail_pT * 2);
    }
    pop();

    // Update cursor
    if (isMouseOverSloth(mouseX, mouseY)) {
        cursor('pointer');
    } else {
        cursor(ARROW);
    }

    // Draw confetti
    if (confettiActive) {
        for (let i = confettiParticles.length - 1; i >= 0; i--) {
            let p = confettiParticles[i];
            p.update();
            p.display();
            if (p.isDead()) {
                confettiParticles.splice(i, 1);
            }
        }
    }
}

function drawPixelSloth(p) {
    rectMode(CENTER);
    noStroke();

    // Body
    fill(furColor);
    rect(0, p * 2, p * 10, p * 12);
    fill(faceColor);
    rect(0, p * 2, p * 6, p * 8);
    fill(shadeColor);
    rect(p * 4, p * 2, p * 2, p * 12);
    rect(-p * 4, p * 2, p * 2, p * 12);
    rect(0, p * 7, p * 10, p * 2);

    // Head
    let headY = -p * 5;
    fill(furColor);
    rect(0, headY, p * 9, p * 7);
    fill(faceColor);
    rect(0, headY, p * 7, p * 5);
    fill(patchColor);
    rect(-p * 2.5, headY, p * 3, p * 4);
    rect(p * 2.5, headY, p * 3, p * 4);
    fill(blackColor);
    rect(-p * 2.5, headY, p, p);
    rect(p * 2.5, headY, p, p);
    rect(0, headY + p * 2, p * 3, p);

    // Left arm
    let armY = -p * 1;
    let armW = p * 3;
    let armH = p * 9;
    let armOffsetX = p * 6.5;
    fill(furColor);
    rect(-armOffsetX, armY, armW, armH);
    fill(shadeColor);
    rect(-armOffsetX + p, armY, p, armH);
    fill(blackColor);
    let clawBaseYL = armY + armH / 2;
    rect(-armOffsetX - p * 0.5, clawBaseYL + p * 0.5, p, p * 2);
    rect(-armOffsetX + p * 0.5, clawBaseYL + p * 1.5, p, p * 2);
    rect(-armOffsetX + p * 1.5, clawBaseYL + p * 0.5, p, p * 2);

    // Right arm
    fill(furColor);
    rect(armOffsetX, armY, armW, armH);
    fill(shadeColor);
    rect(armOffsetX - p, armY, p, armH);
    fill(blackColor);
    let clawBaseYR = armY + armH / 2;
    rect(armOffsetX + p * 0.5, clawBaseYR + p * 0.5, p, p * 2);
    rect(armOffsetX - p * 0.5, clawBaseYR + p * 1.5, p, p * 2);
    rect(armOffsetX - p * 1.5, clawBaseYR + p * 0.5, p, p * 2);

    // Left leg
    let legY = p * 8.5;
    let legW = p * 4;
    let legH = p * 5;
    let legOffsetX = p * 2.5;
    fill(furColor);
    rect(-legOffsetX, legY, legW, legH);
    fill(shadeColor);
    rect(-legOffsetX + p * 1.5, legY, p, legH);
    fill(blackColor);
    rect(-legOffsetX - p * 1, legY + p * 2, p * 3, p);
    rect(-legOffsetX - p * 1, legY + p * 2.5, p, p * 2);
    rect(-legOffsetX + p * 0, legY + p * 2.5, p, p * 2);
    rect(-legOffsetX + p * 1, legY + p * 2.5, p, p * 2);

    // Right leg
    fill(furColor);
    rect(legOffsetX, legY, legW, legH);
    fill(shadeColor);
    rect(legOffsetX - p * 1.5, legY, p, legH);
    fill(blackColor);
    rect(legOffsetX + p * 1, legY + p * 2, p * 3, p);
    rect(legOffsetX + p * 1, legY + p * 2.5, p, p * 2);
    rect(legOffsetX + p * 0, legY + p * 2.5, p, p * 2);
    rect(legOffsetX - p * 1, legY + p * 2.5, p, p * 2);
}

function drawPixelText(message, startX, startY, p, charW, charH, spacingP, colors, scales, alignLeft = false) {
    let currentX = startX;
    let currentY = startY;
    let lines = message.split('\n');
    let charIndex = 0;

    push();
    noStroke();
    rectMode(CENTER);

    for (let lineIndex = 0; lineIndex < lines.length; lineIndex++) {
        let line = lines[lineIndex];
        let lineRenderWidthPixels = line.length * charW + (line.length > 0 ? line.length - 1 : 0) * spacingP;
        let lineRenderWidth = lineRenderWidthPixels * p;

        currentX = alignLeft ? startX : startX - lineRenderWidth / 2;
        currentY = startY + lineIndex * (charH + textLineSpacing) * p;

        for (let i = 0; i < line.length; i++) {
            let char = line[i].toUpperCase();
            let charColor = (colors && charIndex < colors.length) ? colors[charIndex] : blackColor;
            let charScale = (scales && charIndex < scales.length) ? scales[charIndex] : 1.0;

            let charCenterX = currentX + (charW * p) / 2;
            let charCenterY = currentY + (charH * p) / 2;

            push();
            translate(charCenterX, charCenterY);
            scale(charScale);
            fill(charColor);
            drawPixelChar(char, p, charW, charH);
            pop();

            currentX += (charW + spacingP) * p;
            charIndex++;
        }
    }
    pop();
}

function drawPixelChar(char, p, cW, cH) {
    const px = (x, y) => {
        let centerX = cW / 2;
        let centerY = cH / 2;
        rect((x - centerX) * p, (y - centerY) * p, p, p);
    };

    switch (char) {
        case 'A': px(2, 0); for (let i = 0; i < 3; i++) px(1 + i, 1); for (let y = 2; y < cH; y++) { px(0, y); px(4, y); } px(1, 3); px(2, 3); px(3, 3); break;
        case 'B': for (let y = 0; y < cH; y++) px(0, y); px(1, 0); px(2, 0); px(3, 0); px(4, 1); px(1, 3); px(2, 3); px(3, 3); px(4, 2); px(4, 4); px(1, cH - 1); px(2, cH - 1); px(3, cH - 1); px(4, cH - 2); break;
        case 'C': for (let y = 1; y < cH - 1; y++) px(0, y); px(1, 0); px(2, 0); px(3, 0); px(4, 1); px(1, cH - 1); px(2, cH - 1); px(3, cH - 1); px(4, cH - 2); break;
        case 'D': for (let y = 0; y < cH; y++) px(0, y); px(1, 0); px(2, 0); px(3, 0); px(4, 1); px(4, 2); px(4, 3); px(4, 4); px(1, cH - 1); px(2, cH - 1); px(3, cH - 1); break;
        case 'E': for (let y = 0; y < cH; y++) px(0, y); px(1, 0); px(2, 0); px(3, 0); px(4, 0); px(1, 3); px(2, 3); px(3, 3); px(1, cH - 1); px(2, cH - 1); px(3, cH - 1); px(4, cH - 1); break;
        case 'F': for (let y = 0; y < cH; y++) px(0, y); px(1, 0); px(2, 0); px(3, 0); px(4, 0); px(1, 3); px(2, 3); px(3, 3); break;
        case 'G': for (let y = 1; y < cH - 1; y++) px(0, y); px(1, 0); px(2, 0); px(3, 0); px(4, 1); px(4, 3); px(4, 4); px(3, 4); px(2, 4); px(1, cH - 1); px(2, cH - 1); px(3, cH - 1); px(4, cH - 2); break;
        case 'H': for (let y = 0; y < cH; y++) { px(0, y); px(4, y); } px(1, 3); px(2, 3); px(3, 3); break;
        case 'I': for (let x = 0; x < cW; x++) { px(x, 0); px(x, cH - 1); } for (let y = 1; y < cH - 1; y++) px(2, y); break;
        case 'J': for (let x = 0; x < cW; x++) px(x, 0); for (let y = 1; y < cH; y++) px(3, y); px(0, cH - 1); px(1, cH - 1); px(2, cH - 1); break;
        case 'K': for (let y = 0; y < cH; y++) px(0, y); px(4, 0); px(3, 1); px(2, 2); px(1, 3); px(2, 4); px(3, 5); px(4, 6); break;
        case 'L': for (let y = 0; y < cH; y++) px(0, y); px(1, cH - 1); px(2, cH - 1); px(3, cH - 1); px(4, cH - 1); break;
        case 'M': for (let y = 0; y < cH; y++) { px(0, y); px(4, y); } px(1, 1); px(2, 2); px(3, 1); break;
        case 'N': for (let y = 0; y < cH; y++) { px(0, y); px(4, y); } px(1, 1); px(2, 2); px(3, 3); px(2, 4); px(1, 5); break;
        case 'O': for (let y = 1; y < cH - 1; y++) { px(0, y); px(4, y); } px(1, 0); px(2, 0); px(3, 0); px(1, cH - 1); px(2, cH - 1); px(3, cH - 1); break;
        case 'P': for (let y = 0; y < cH; y++) px(0, y); px(1, 0); px(2, 0); px(3, 0); px(4, 1); px(4, 2); px(1, 3); px(2, 3); px(3, 3); break;
        case 'Q': for (let y = 1; y < cH - 1; y++) { px(0, y); px(4, y); } px(1, 0); px(2, 0); px(3, 0); px(1, cH - 1); px(2, cH - 1); px(3, cH - 2); px(4, cH - 1); break;
        case 'R': for (let y = 0; y < cH; y++) px(0, y); px(1, 0); px(2, 0); px(3, 0); px(4, 1); px(4, 2); px(1, 3); px(2, 3); px(3, 3); px(3, 4); px(4, 5); px(4, 6); break;
        case 'S': px(4, 1); px(3, 0); px(2, 0); px(1, 0); px(0, 1); px(0, 2); px(1, 3); px(2, 3); px(3, 3); px(4, 4); px(4, 5); px(3, 6); px(2, 6); px(1, 6); px(0, 5); break;
        case 'T': for (let x = 0; x < cW; x++) px(x, 0); for (let y = 1; y < cH; y++) px(2, y); break;
        case 'U': for (let y = 0; y < cH - 1; y++) { px(0, y); px(4, y); } px(1, cH - 1); px(2, cH - 1); px(3, cH - 1); break;
        case 'V': for (let y = 0; y < 4; y++) { px(0, y); px(4, y); } px(1, 4); px(3, 4); px(2, 5); px(2, 6); break;
        case 'W': for (let y = 0; y < cH; y++) { px(0, y); px(4, y); } px(1, 5); px(3, 5); px(2, 4); px(2, 3); break;
        case 'X': px(0, 0); px(4, 0); px(1, 1); px(3, 1); px(2, 2); px(1, 3); px(3, 3); px(0, 4); px(4, 4); px(0, 5); px(4, 5); px(0, 6); px(4, 6); break;
        case 'Y': px(0, 0); px(1, 1); px(4, 0); px(3, 1); px(2, 2); px(2, 3); px(2, 4); px(2, 5); px(2, 6); break;
        case 'Z': for (let x = 0; x < cW; x++) { px(x, 0); px(x, cH - 1); } px(4, 1); px(3, 2); px(2, 3); px(1, 4); px(0, 5); break;
        case '0': for (let y = 1; y < cH - 1; y++) { px(0, y); px(4, y); } px(1, 0); px(2, 0); px(3, 0); px(1, cH - 1); px(2, cH - 1); px(3, cH - 1); px(1, 2); px(3, 4); break;
        case '1': px(1, 0); px(2, 0); px(3, 1); for (let y = 0; y < cH; y++) px(2, y); px(0, cH - 1); px(1, cH - 1); px(3, cH - 1); px(4, cH - 1); break;
        case '2': px(1, 0); px(2, 0); px(3, 0); px(4, 1); px(4, 2); px(3, 3); px(2, 3); px(1, 3); px(0, 4); px(0, 5); px(1, cH - 1); px(2, cH - 1); px(3, cH - 1); px(4, cH - 1); break;
        case '3': px(1, 0); px(2, 0); px(3, 0); px(4, 1); px(4, 2); px(1, 3); px(2, 3); px(3, 3); px(4, 4); px(4, 5); px(1, cH - 1); px(2, cH - 1); px(3, cH - 1); break;
        case '4': for (let y = 0; y < 4; y++) px(0, y); px(1, 2); px(2, 2); px(3, 2); for (let y = 0; y < cH; y++) px(4, y); break;
        case '5': px(1, 0); px(2, 0); px(3, 0); px(4, 0); px(0, 1); px(0, 2); px(1, 3); px(2, 3); px(3, 3); px(4, 4); px(4, 5); px(1, cH - 1); px(2, cH - 1); px(3, cH - 1); break;
        case '6': px(1, 0); px(2, 0); px(3, 0); px(4, 1); px(0, 1); px(0, 2); px(0, 3); px(1, 3); px(2, 3); px(3, 3); px(0, 4); px(0, 5); px(1, cH - 1); px(2, cH - 1); px(3, cH - 1); break;
        case '7': px(1, 0); px(2, 0); px(3, 0); px(4, 0); px(4, 1); px(3, 2); px(2, 3); px(2, 4); px(2, 5); px(2, 6); break;
        case '8': px(1, 0); px(2, 0); px(3, 0); px(0, 1); px(4, 1); px(0, 2); px(4, 2); px(1, 3); px(2, 3); px(3, 3); px(0, 4); px(4, 4); px(0, 5); px(4, 5); px(1, cH - 1); px(2, cH - 1); px(3, cH - 1); break;
        case '9': px(1, 0); px(2, 0); px(3, 0); px(0, 1); px(4, 1); px(0, 2); px(4, 2); px(1, 3); px(2, 3); px(3, 3); px(4, 3); px(4, 4); px(4, 5); px(1, cH - 1); px(2, cH - 1); px(3, cH - 1); break;
        case ':': px(2, 2); px(2, 4); break;
        case '-': px(1, 3); px(2, 3); px(3, 3); break;
        case ' ': break;
        default: for (let x = 0; x < cW; x++) for (let y = 0; y < cH; y++) px(x, y); // Fallback: filled block
    }
}

function isMouseOverSloth(mx, my) {
    let slothW = pS * 14; // Approximate width including arms
    let slothH = pS * 20; // Approximate height from head to legs
    let slothLeft = slothCurrentX - slothW / 2;
    let slothRight = slothCurrentX + slothW / 2;
    let slothTop = slothCurrentY - pS * 10; // Head top
    let slothBottom = slothCurrentY + pS * 10; // Leg bottom
    return mx >= slothLeft && mx <= slothRight && my >= slothTop && my <= slothBottom;
}

function mousePressed() {
    if (isMouseOverSloth(mouseX, mouseY)) {
        confettiActive = true;
        confettiParticles = [];
        for (let i = 0; i < confettiCount; i++) {
            confettiParticles.push(new Particle(slothCurrentX, slothCurrentY - pS * 5));
        }
        if (navigationTimer) clearTimeout(navigationTimer);
        navigationTimer = setTimeout(() => {
            // Replace with actual navigation logic, e.g., window.location.href = '/market';
            console.log('Navigate to market page');
        }, navigationDelay);
    }
}

function windowResized() {
    resizeCanvas(windowWidth, windowHeight);
    calculatePixelSizes();
    calculateLayoutParameters();
    slothCurrentX = width / 2;
    slothTargetX = width / 2;
    targetLetterIndex = findLetterIndex(slothTargetX);
}
