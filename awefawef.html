<script>
    /* Image carousel container styles */
    .product-carousel {
        width: 100%;
        height: 250px;
        overflow: hidden;
        position: relative;
        background-color: #f0f0f0;
    }
    
    /* Gallery modal */
    .gallery-modal {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background-color: rgba(0, 0, 0, 0.9);
        z-index: 50;
        display: none;
        justify-content: center;
        align-items: center;
        transition: opacity 0.3s ease;
    }
    
    .gallery-modal.active {
        display: flex;
    }
    
    /* Swiper customization */
    .swiper-pagination-bullet {
        background: #5D5CDE;
    }
    
    .swiper-pagination-bullet-active {
        background: #A5A4FF;
    }
    
    /* Zoom effect for modal */
    .modal-img-container {
        max-width: 90vw;
        max-height: 90vh;
    }
    
    .modal-img-container img {
        max-width: 100%;
        max-height: 90vh;
        object-fit: contain;
    }
</script>
```
